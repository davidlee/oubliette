[facet]                         # every field typed; seeded empty (captured later)
question = "Given an injected credential copied at time T, how long does it stay good?"
why_matters = "The token rotates on refresh and the capsule holds a copy, so host and capsule drift. Until measured, the mitigation is re-inject when something breaks."
answer = "Long enough not to matter: on the order of a year, by the user's estimate (2026-11-08). Not measured; no observation landed. Re-inject with capsule-inject --force if a copy fails sooner."
