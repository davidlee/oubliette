id = 60
slug = "capability-fragment-interface"
title = "A capability fragment's module is told only its own persistent directory, is room-only for now, and the room image checks guard the door"
record_kind = "decision"
status = "accepted"
created = "2026-10-23"
updated = "2026-10-23"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-009 inq-9. DEC-059 lets a fragment carry a guestModule; a module can set anything, including the door's sshd and routing (POL-001 limb 3, DEC-034)."
choice = """A guestModule is applied with lib.modules.importApply {persistDir = "/home/.fragments/<name>";}, as door.nix takes hostKeyDir; it is never told room or slot. Slots' flavour.extras naming a fragment with a guestModule is refused at eval in this slice: a capsule's volume is its checkout. mkfleet.nix roomChecks gain PasswordAuthentication = false, PermitRootLogin = prohibit-password and no default route, beside the existing root-keys, DHCP and autologin checks."""
alternatives = ["pass the whole room record to the module", "allow slots to select capability fragments now", "review alone as the guard"]
rationale = "A directory is the one generic thing a service needs; refusing on slots is an explicit absent path rather than a silent package-only half; the guard extends existing checks rather than adding machinery."
consequences = ["roomChecks grow three door rules", "a slot-side refusal with a pinned reason"]
decided_by = "user, on agent proposal"
decided_on = "2026-10-24"

