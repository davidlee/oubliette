schema = "doctrine.knowledge"
version = 1

id = 60
slug = "capability-fragment-interface"
title = "A capability fragment declares the paths it needs persistent and its module is plain guest config; room-only for now, and the room image checks guard the door"
record_kind = "decision"
status = "accepted"
created = "2026-10-23"
updated = "2026-10-23"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-009 inq-9. DEC-059 lets a fragment carry a guestModule; a module can set anything, including the door's sshd and routing (POL-001 limb 3, DEC-034)."
choice = "A fragments.nix entry may carry guestModule (plain NixOS config, applied unparameterised) and persist, a list of absolute guest paths that must survive the guest's lifecycle; the module is never told room or slot, nor where persistence lives. Slots' flavour.extras naming a fragment with a guestModule or persist fails a NixOS assertion in vm/capsule.nix carrying fragments.slotRefusal's message (readable at eval, RV-025 F-8). mkfleet.nix roomChecks gain PasswordAuthentication = false, PermitRootLogin = prohibit-password, no default route, and no elevation (no sudo extraRules or extraConfig, doas off: RV-025 F-3) — a regression guard over named settings, bounded by the vocabulary being oubliette's. Amended 2026-10-24 during drafting (persist, not persistDir) and after RV-025."
alternatives = ["hand the module its own persistDir (the original choice: it would have to order its own source mkdir against the room's boot)", "pass the whole room record to the module", "allow slots to select capability fragments now", "review alone as the guard"]
rationale = "A fragment says what must persist and the guest decides how: the mkdir-before-bind ordering is one generic construction in the guest rather than one per fragment, and a later dedicated volume (DEC-068) is a guest change alone. Refusing on slots is an explicit absent path; the guard extends existing checks."
consequences = ["roomChecks grow three door rules", "a slot-side refusal with a pinned reason", "vm/room.nix owns persistence for every selected fragment"]
decided_by = "user, on agent proposal"
decided_on = "2026-10-24"

