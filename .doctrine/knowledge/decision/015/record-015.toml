[facet]                         # every field typed; seeded empty (captured later)
context = "A per-slot declared profile cannot be validated at eval: profileDir is run-time state outside the store (NOTES item 52)."
choice = "No new check. profileLoad's existing refusal names the profile and the directory; the status cell's `[name]` (DEC-014) attributes it to a non-record source. In passing, correct profileLoad's hint that a document is 'rendered from target.nix' (false since a document may be hand-written)."
alternatives = ["B: the declared step in profileNameFor checks existence and refuses naming capsules.nix (profileCell maps resolver failure to `-`, so status would read 'nothing')", "C: the resolver carries a profileSource through every caller for one line of attribution"]
rationale = "Least code; B makes status lie and C plumbs state for a message."
consequences = ["a case pins a declared default with no document: status `[name]`, verb refuses naming the directory", "profileLoad's hint text changes"]
decided_by = "user"
decided_on = "2026-09-18"

