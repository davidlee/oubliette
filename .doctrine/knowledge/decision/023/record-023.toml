[facet]                         # every field typed; seeded empty (captured later)
context = "SL-003: IMP-012's refusal and ISS-011 (cross-target re-provision) are one rule once slots boot different images. Every profile verb passes one dispatch point in host/cli.nix after its profile name is resolved."
choice = "At the profile-verb dispatch, after resolution: proceed only when the booted runner's capsule.target equals the resolved profile. A mismatch refuses, naming both targets and the fix. No booted runner, or a runner with no marker, also refuses (fail closed)."
alternatives = ["Unknown passes with a notice (kept pre-marker capsules working)", "Additionally warn at start"]
rationale = "The user cares about the design going forward, not about preserving existing capsules (2026-09-30); an image that cannot say what it is has no claim to be acted on."
consequences = ["every capsule booted before SL-003 refuses profile verbs until restarted onto a marked image", "ISS-011 is closed by refusal rather than by fixing the stale guestPath read", "the rule lives in the front end only; off-PATH programs are not checked (mem.fact.oubliette.two-copies-refuse-in-different-orders)"]
