updated = "2026-10-16"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "the justfile mixes oubliette-development recipes with operational ones that a consumer needs; a copy in the template and another in the private consumer would drift."
choice = "recipes move to just/fleet.just; oubliette's justfile imports it directly; a consumer's justfile imports it via a gitignored .oubliette symlink the consumer devshell keeps pointed at the locked oubliette source. justfile_directory() resolves to the root justfile, so just up still passes the consumer as -f."
alternatives = ["copy the recipes into the template", "keep recipes in oubliette parameterised by a CAPSULE_FLEET path"]
rationale = "one copy of the recipes at the same revision as the programs they call."
consequences = ["the symlink is stale until the devshell is re-entered, the same class as mem.fact.oubliette.devshell-binaries-are-store-paths", "a consumer must keep net.nix, policies.nix and perimeter/ at its root, the names the recipes read"]
decided_by = "user, on agent proposal"
