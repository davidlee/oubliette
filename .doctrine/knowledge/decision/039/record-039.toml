[facet]                         # every field typed; seeded empty (captured later)
context = "SL-005 inq-8, research X3. The guard audits only slots (host/guard.nix:56, 67). CON-005 names it as the only reader of namespaces. POL-001: the drop is verified at run time."
choice = "The guard's declared list is guests = slots and rooms. Each gets limb two (its VMM is inside its own namespace) and, when present, forwarding off and the capsule-guard tap rule. A failure is fleet-wide, as for a slot."
alternatives = ["amend CON-005 to leave rooms unaudited"]
rationale = "A room VMM outside its namespace would sit on a root-namespace tap, which is a breach. The checks already exist and are per namespace."
consequences = ["a broken room tears the fleet's egress down, as a broken slot does", "guardCases gains a room case"]
