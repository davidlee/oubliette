schema = "doctrine.knowledge"
version = 1

id = 63
slug = "postgres-socket-only-peer-auth"
title = "PostgreSQL listens on its unix socket only; a login reaches only its own database by peer auth; a host client forwards the socket over the door"
record_kind = "decision"
status = "accepted"
created = "2026-10-23"
updated = "2026-10-23"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-009 inq-4. A room has no uplink (DEC-036, POL-001). The door's sshd is NixOS-default, which permits stream-local forwarding."
choice = "listen_addresses = ''. authentication is replaced (mkForce) by two rules: local all postgres peer map=postgres, then local samerole all peer, so a login connects only to a database named for a role it is a member of: its own, or a shared one the operator makes (CREATE ROLE <db> NOLOGIN; CREATE DATABASE <db> OWNER <db>; GRANT <db> TO <logins>) as guest root via runuser -u postgres -- psql. No CREATEDB; no room user can become postgres. A login whose name PostgreSQL reserves or a fresh cluster already holds (pg_*, postgres, public, none, current_user, current_role, session_user, template0, template1) fails the fragment's own assertion at eval. A host client uses ssh -L <port>:/run/postgresql/.s.PGSQL.5432 over the existing door. No host network path, no passwords. Amended 2026-10-24 after RV-025 F-1, F-6, F-9; samerole over sameuser on the user's request, for operator-made shared databases."
alternatives = ["TCP on localhost inside the guest", "a new host-side forward or socket relay", "keep CREATEDB and revoke PUBLIC CONNECT per database", "shared databases with identity-only separation"]
rationale = "Adds nothing to the perimeter and nothing to manage; identity is the door's key auth."
consequences = ["that a forwarded connection reaches peer auth as the logged-in user is inferred and verified live (inq-8)"]
decided_by = "user, on agent proposal"
decided_on = "2026-10-24"

