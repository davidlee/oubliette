slug = "a-profile-name-in-a-host-declaration-is-a-value-not-a-learned-target"
title = "A profile name in a host declaration is a value, not a learned target"
record_kind = "decision"
status = "accepted"
created = "2026-09-18"
updated = "2026-09-18"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "A per-slot declared default target (SL-001) puts a target name in capsules.nix, which POL-002's literal wording forbids."
choice = "Revise POL-002 via doctrine revision inside SL-001. The enumerated sentence becomes: a target's name may appear in code (*.nix, *.sh and the justfile, outside comments, .doctrine/ and the tool configuration — .mcp.json, .claude/, .codex/) only in target.nix, inputs.target.url, and as a slot's profile value in capsules.nix. It is paired with the rule behind the list: generic source never hardcodes a target's identity or branches on it; a host-declared value may be threaded into a generated front end, as slotPolicy threads a policy name. And a case suite's fixture may reproduce a target's layout as data."
alternatives = ["A: ship the field unset everywhere (dead on arrival)", "B: profile = target.name by reference (single-target only; couples capsules.nix to target.nix)", "D: per-slot defaults in run-time host state (breaks POL-003, two homes for slots)"]
rationale = "The policy guards mechanism against learning a client's identity; the review test (code changed, or only a value?) is passed by a declared value. The enumeration keeps the policy checkable by search (outside comments) and confines the exception to one field of one file; a provenance-only wording would be correct but unsearchable, letting later exceptions be argued in. The generated front end carries the name but lives in the store, not the repo."
consequences = ["SL-001 carries a POL-002 revision", "SL-001 also revises POL-003 (slots row and resolution order)", "contract-target.md updated in the same commit as the boundary move", "which slots declare which profile is a separate values question"]
decided_by = "user"
decided_on = "2026-09-18"

