[facet]                         # every field typed; seeded empty (captured later)
context = "research X1: both files hold generic machinery beside the host list, and fixture suites lean on the machinery (host/guard-cases.nix:76-95)."
choice = "oubliette keeps capsules.nix as a function of the declared slot set (instances, socketOf, recordOf, volumeLock, asserts) and targets/default.nix as a function of the target set (derive, volumePath); the consumer supplies the declared slots and its targets/*.nix files."
alternatives = ["move both files wholesale to the consumer"]
rationale = "moving wholesale leaves oubliette's own suites with no machinery; splitting is SL-003's DEC-018 seam extended to two more files, and fixture suites stop depending on the real slots."
consequences = ["the consumer's capsules.nix is data only", "machinery reasoning comments stay in oubliette"]
