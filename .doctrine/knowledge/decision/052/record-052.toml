schema = "doctrine.knowledge"
version = 1

id = 52
slug = "room-base-is-floor-plus-declared-extras"
title = "A room's base tools are a fixed floor plus the extras the room declares, rendered once and read by session"
record_kind = "decision"
status = "accepted"
created = "2026-10-18"
updated = "2026-10-18"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-007 inq-1/inq-2/inq-5, IMP-017 (RV-018 F-1 option b). session reached git through a caller PATH nothing promised. DEC-044 gave a room no extras; the user wants per-room convenience (malebolge: a shell, emacs, fd, ripgrep, nushell), including for an interactive login."
choice = "Every room has a base: buildEnv of a fixed floor (git, bash, coreutils-full, which; coreutils-full is NixOS's own, amended at SL-007 PHASE-03) plus compose of rooms.<r>.extras, names from fragments.nix. Extend, never replace. vm/room.nix renders it as /etc/room/base and adds it to environment.systemPackages. session sets PATH = tools/bin : /etc/room/base/bin : caller. A repo tool set is never unioned with the base; collisions are checked inside the base buildEnv only."
alternatives = ["the floor fixed in session's text (no per-room set)", "a room-declared set that replaces the floor", "bare packages in the room declaration instead of vocabulary names", "rely on environment.systemPackages alone (ignores collisions, and a non-login PATH is not promised)"]
rationale = "One list serves session and an interactive login; session stays one generic store path reading a tree (DEC-049); convenience stays declared in the one vocabulary (fragments.nix), per room under POL-003; the floor keeps DEC-043's git for satan's runner."
consequences = ["supersedes DEC-044", "fragments.nix gains finer fragments as values", "each room image grows by its extras", "sessionCases and rooms-cases change", "a login shell and editor config stay out (follow-ups)"]
decided_by = "user, on agent proposal"
decided_on = "2026-10-19"

