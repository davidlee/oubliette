[facet]                         # every field typed; seeded empty (captured later)
context = "research X3: $root (CAPSULE_ROOT/$PWD) is both the flake built and where .vm/ state lives; a flake cannot know its own checkout path."
choice = "the operator works in the consumer checkout (/srv/fleet on this host), whose .vm/ is gitignored; CAPSULE_ROOT/$PWD semantics are unchanged; fleetPath is declared once in the consumer and read only where a program cannot know it (the module's policyDir)."
alternatives = ["separate the flake ref from the state root as two values"]
rationale = "no program text changes, so the devshell path keeps working with no rebuild and no root (G8); one declared path rather than two."
consequences = ["/srv/fleet must be writable by the operator without root", "microvm records /srv/fleet per slot"]
