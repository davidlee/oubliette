choice = "capsule <room> push <repo> <branch> and capsule <room> collect <repo> <branch> resolve repo against the room's declared repos (exit 2 otherwise) and exec capsule-room-git --room <room> --profile <repo> with the room's policy. capsule <room> forget-host-key empties the room's known_hosts. ssh uses the room's known_hosts and alias room-<room>. start, stop and status are unchanged; every other verb refuses, naming the room."
