[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "Expected each policyCases case to set up its own state; observed case 8 proceeds only because case 4 left a record naming duo"
detail = """
host/policy-cases.nix:1645. Slot `dflt` declares `solo`. Case 8 boots a devshell image for `duo` and asserts the verb proceeds with `--profile duo`. Without an assignment record, resolution would give `solo` and the image check would refuse. The only record naming `duo` is the one case 4 wrote (:1608). So case 8 passes on another case's leftover state, and reordering or deleting case 4 changes its verdict for a reason the case does not state (CLAUDE.md: never inherit the previous round's wreckage). To be confirmed by mutation.
"""
disposition = "fix-now"
response = """
Fixed in 77310cc. Case 8 passes `--profile duo`, so its verdict turns only on which link is read. Mutation evidence: without the fix, deleting case 4 turned case 8 red. With the fix, deleting case 4 keeps the suite green, and swapping bootedOf's branches still turns case 8 red (with 1-4).
"""

[[finding.turn]]
