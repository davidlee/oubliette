- The `target.nix` → `targets/` rename sweep (ff412b1, 0b6ca11, PHASE-03). Only comments and one echo string changed: fragments.nix, host/state-snapshot.nix, host/state-snapshot-cases.nix, policies.nix, setup.nix, vm/guest-path.nix, probe/{freshness,netns-boot,netns-egress,two-capsules}.sh, docs/{architecture-walkthrough,contract-doctrine,contract-flavour,design}.md, .doctrine/project-orientation.md.
