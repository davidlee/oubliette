[[finding]]
id = "F-5"
status = "answered"
severity = "major"
title = "The render comparison does not pin both shipped doors"
detail = "Case 3 calls roomDoor.words directly (sec-5). The channel assembles its own ssh_cmd (host/room-git.nix:224); roomVerbsCases pins only the front end (room-verbs-cases.nix:350); roomGitCases cannot reach ssh past the banner (room-git-cases.nix:18). The suite could pass with the channel calling the render wrongly. Fix: a case over the channel's shipped command construction; mutate the call site."
disposition = "fix-now"
response = "Verified (room-git.nix:224-228; room-git-cases.nix:18). Spike 2026-10-20: an unprivileged sshd -i (openssh 10.5p1) behind socat UNIX-LISTEN made accept-new write 'room-x ssh-ed25519 …' to the declared known_hosts, then auth failed (Permission denied, 255). roomClientCases gains a fixture sshd behind the room's socket and drives (a) the shipped capsule-room-git push: the entry lands under room-<r> in $state/room/<r>/known_hosts; (b) the bundle's ssh before that: 'Host key verification failed'; after it: 'Permission denied' (key accepted). Mutating the channel's call site (wrong alias or trust store) turns (a) red. Unverified: sshd inside the nix build sandbox; if it cannot run there, this falls back to a stated residual and the user is told."

