[[finding]]
id = "F-3"
status = "answered"
severity = "major"
title = "A jail can fail to start before any room relay has started"
detail = "Binds /run/capsule-room (sec-4), but only each relay's nested RuntimeDirectory creates it, at service start (host/services.nix:335); tmpfiles makes the state dir, not the /run parent (services.nix:793). Fix: create /run/capsule-room at boot; test jail start before the first relay start."
disposition = "fix-now"
response = "Verified from services.nix:335 and :793: nothing makes /run/capsule-room except a relay start. The module gains a tmpfiles rule d <dirOf (dirOf (socketOf r))> 0755 root root, emitted once when rooms exist and derived from socketOf (no new spelling); hostModuleUnits pins it. A jail started before any relay then binds an existing empty directory and sees each room's door appear and disappear under it."

