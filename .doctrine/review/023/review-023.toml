[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "Global host keys can defeat the promised first-contact refusal"
detail = "optionsOf sets UserKnownHostsFile but not GlobalKnownHostsFile (design sec-3). sec-4 promises refusal before the first push and after forget-host-key. pi-env sets GlobalKnownHostsFile=none (pi-env dist/ssh.js:67); plain ssh -F does not: ssh -G -F /dev/null lists /etc/ssh/ssh_known_hosts*. Fix: GlobalKnownHostsFile none for clients; decide for oubliette's doors; assert in the suite."
disposition = "fix-now"
response = "Verified: ssh -G -F /dev/null resolves globalknownhostsfile /etc/ssh/ssh_known_hosts /etc/ssh/ssh_known_hosts2. optionsOf gains GlobalKnownHostsFile none for every door, oubliette's included: DEC-047 says every door checks one store, and today's door words silently also consult the global files. roomClientCases case 1 asserts globalknownhostsfile none on both renders."

