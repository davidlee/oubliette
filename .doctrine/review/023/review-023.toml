[[finding]]
id = "F-4"
status = "answered"
severity = "major"
title = "The new stateDir accepts shell syntax that its readers execute"
detail = "The eval refusal checks only absoluteness, whitespace and % (sec-2). /tmp/$(id) passes, then enters generated shell unquoted at host/cli.nix:937 (recordRoot=${moduleState}) and host/volume-root.nix:76. Fix: escape at every insertion, keep the ssh refusal, add hostile-path cases for the shipped CLI and root helper."
disposition = "fix-now"
response = "Verified: cli.nix:937 and volume-root.nix:76 splice moduleState unquoted. Different fix from the proposal: the eval refusal narrows stateDir to an absolute path over [A-Za-z0-9._+/-] with no '..' component. That one check covers the ssh concerns (whitespace, %) and every shell insertion, current and future, instead of escaping at each site. fleetCases pins the refusal and its reason for $(…), a space, %, a relative path and '..'. The seams' shell-expression form for suites is unchanged."

