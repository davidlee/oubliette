[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "design sec-4 says guest root is reached only by admin keys; the stop key is an unrestricted root login too"
detail = """
Expected (design.md:154, :158, :300): "Root in the guest is reached only by the host's admin keys"; the superuser path is "root, so with an admin key".
Observed: vm/door.nix:86 installs the host's stop key (the microvm@ units' reboot credential) in root's authorized_keys with no command= restriction, so it is a full root login. A room with adminKeys = [] still has a root path. README was corrected in e07fb7b; memory mem.fact.oubliette.room-postgres-superuser-path records it. The design still says "only".
"""
disposition = "design-wrong"
response = """
Code and README are right; the design's "only by admin keys" is false. Reconcile design sec-4 (design.md:154, :158, :300) to name both root credentials: the host's admin keys and the stop key. Reconciliation Brief, per-slice.
"""

