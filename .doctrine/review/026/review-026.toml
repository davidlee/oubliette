title = "design sec-6 describes eight cases built by one module each; the suite has a ninth, and the capsule case changes a specialArg"
detail = """
Expected (design.md:241-271): negative cases are "the same images extended with one module each (extendModules)"; eight numbered cases; persistence rules exercised under roomImages.
Observed: fragments-cases.nix:114-116 `capsuleWithPg` is extendModules with `specialArgs.flavour` overridden, not a module; fragments-cases.nix:186-193 adds case "9. The persistence rules" (fsType, x-systemd.requires breaks with a clean control), and the header (line 22) numbers the order "1-3 and 7 ... then 4-6 and 9". Behaviour is sound; the design does not describe it.
"""
