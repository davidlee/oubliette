[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "fragmentsCases leaves several sec-3/sec-5 mechanisms unpinned"
detail = """
Expected: each rule and rendered mechanism the design names has a case that goes red when it breaks (house rule: mutate and re-run).
Observed (none required by the design's case list, so not a conformance break):
- the door's password-auth, root-login and default-route rules (sec-5) have no negative case; only the elevation rule (case 7) and the persistence rules (case 9) do;
- the bind's `.mount` in room-persist's `before`, and the bind landing in local-fs.target, are unpinned (sec-3);
- room-persist's script text (umask, mkdir only when missing) is unpinned;
- no case proves an unselected fragment's guestModule is never evaluated (case 6 shows nothing rendered, not that nothing was forced).
Mitigation: PHASE-05 step 1 observed the ordering live on one boot (ASM-005 validated), which covers the second item at the live rung but not against regression.
"""
disposition = "follow-up"
response = """
Not required by the design's case list, so no conformance break; real coverage debt worth owning. Captured as IMP-027 (originates_from SL-009). Code test gaps, not spec, so follow-up is the right route.
"""

