[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "design sec-4 offers 'capsule <room> ssh' for the -L forward; that verb takes no ssh options"
detail = """
Expected (design.md:191-192): host access by `ssh -L 5432:/run/postgresql/.s.PGSQL.5432` "with the room-client bundle or `capsule <room> ssh`".
Observed: host/cli.nix:1922-1948, the room ssh verb execs `"${ssh_argv[@]}" "$user@${net.guest}" "$@"`: the destination precedes the caller's args, so anything after the user is the remote command. No -L can pass. README.md:636-638 says so; the live forward (PHASE-05 step 4) used the room-client bundle.
"""
disposition = "design-wrong"
response = """
The verb's no-options shape is deliberate (argv after the user is the remote command); the design's offer is the error. Reconcile design sec-4 (design.md:191-192) to the room-client bundle only. Reconciliation Brief, per-slice.
"""

