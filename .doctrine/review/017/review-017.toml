status = "verified"
severity = "major"
title = "Expected: sec-9 row 3's mkFleet-level verdict that a borrowing fabric throws. Observed: only fabric.nix's reason is pinned, and the throw fires only when a probe is forced"
detail = """
Expected (design sec-9 row 3): "a fixture variant whose fabric names `room-lounge` throws, with the reason, from `borrowed`" — an eval verdict over mkFleet.

Observed: `fabricCases` (fabric-cases.nix) pins `fabric.nix`'s `borrowed` and `reason` as values; its header says it does not prove "that mkFleet asserts on `reason` (its wiring line)". The wiring is `fabricPrelude = assert fabricCheck.reason == null || throw fabricCheck.reason;` (mkfleet.nix:1205). Deleting that assert leaves every suite green. The only evidence is PHASE-04's hand eval V5 line 2 and mutation M1 (gitignored phase sheet).

Second half: the throw sits in `fabricPrelude`, so it fires only when a probe derivation is forced (PHASE-04 M5: "the probe prelude forces roomRecords"). POL-003 (lines 47-48, 84) and CLAUDE.md:163 say `borrowed` "throws at eval in every caller's eval, the consumer's included". That holds for a `just build` that lists probes, but not for an eval of `nixosModules` or a runner alone. The wording predates SL-005 (233a0e3^ has the same assert placement); REV-004 reworded the paragraph and kept the claim."""
disposition = "follow-up"
response = """User's choice this session: "Defer: backlog item". The finding is code (a missing pin, and an assert placed where only a probe forces it), not governance. The policy's wording is the target the code will be brought to meet, so no REV. It is deferred not because the fix is large (one line moves, one case is added) but because both files are in the tree SL-006 is being implemented in. Captured as ISS-022 with the fix and its mutation. Standing risk until then: a probe fabric borrowing a name breaks only builds that include probes. That is the consumer's `just build`, which is where a probe is used anyway."""

