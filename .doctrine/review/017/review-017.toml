[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Expected: slot start readiness unchanged and pinned after PHASE-07's doorVia/answers refactor. Observed: it reads as equivalent, but no suite pins it and no slot has been started live since"
detail = """
PHASE-07 (57e28ad) split `door` into `doorVia <mode> <alias> <socket>` + `door`/`roomDoor`, and `answers`/`waitAnswers` now take `<door-fn> <name> <user>`. Slot start calls `waitAnswers door "$name" agent` (host/cli.nix:2034); room start calls `waitAnswers roomDoor "$room" root` (1885).

Read against 57e28ad^ (cli.nix:728-765): the old `door` set ssh_argv by mode, appended ProxyCommand and returned 0 when the socket existed, else fell to `doorsOpen; devshellTap`. The new `door` = `doorVia … && return 0; doorsOpen; devshellTap`, with doorVia returning 1 for no socket. `answers` used `agent@` hard-coded; it now takes the user as `$3`. There are no other callers. Equivalent by reading.

Pinned by nothing: `pkgs.openssh` is in the front end's runtimeInputs, so no case can stub ssh (RV-014 F-6). PHASE-09's live run started only the room. `capsule all status` on this host today shows no slot up."""
disposition = "tolerated"
response = "Tolerated: the refactor is equivalent by line-by-line reading (detail). The one input that changed, the user, is a literal `agent` at the only slot call site. No case can stub ssh, because the front end's runtimeInputs carry openssh (RV-014 F-6; CLAUDE.md treats it as a boundary, not something to work around). The live room start exercised `doorVia`, `answers` and `waitAnswers` through the shared code, and only `door`'s two-line wrapper is slot-specific. Residual: the first `capsule <slot> start` on this host is the evidence. Named in the synthesis as a check for the user."

