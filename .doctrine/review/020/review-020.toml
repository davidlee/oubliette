title = "DEC-052 supersedes DEC-044 (expected); DEC-044 is still accepted with no supersede edge (observed)"
detail = """
Expected (design sec-1, DEC-052, slice scope 1): DEC-044 superseded by DEC-052, so the corpus has one accepted answer to "what is a room's base".
Observed: `doctrine show DEC-044` reads `accepted`, choice still "No fleet extras in a room. The base PATH is git plus the NixOS required packages". `doctrine inspect DEC-052` shows only `shapes: SL-007` — no supersedes edge. PHASE-04 ran `doctrine supersede DEC-052 DEC-044` (rc 0); it changed only DEC-044's `updated` date (notes § PHASE-04; friction observation committed in 34160e8).
Two accepted decisions contradict on tier 2: drift, not history.
"""
disposition = "design-wrong"
response = """
Governance, not code: the implementation is DEC-052's. Reconcile records the supersession so it holds: DEC-044 → superseded by DEC-052 (status + edge) through the knowledge verb, not by hand; the PHASE-04 `supersede` no-op is already an observation. Brief: § Governance/spec, F-1.
"""

