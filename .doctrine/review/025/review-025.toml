[[finding]]
id = "F-9"
status = "answered"
severity = "major"
title = "The name assertion still permits taking ownership of PostgreSQL's template databases"
detail = """
Raiser: codex. Blocks: no (major). Newly discovered collision in the revised design, distinct from F-6's pg_* role-namespace defect. Locus: .doctrine/slice/009/design.md:113-119, :132-147 and :150-152 (sec-4), with coverage at :230-231.

Expected: an accepted login gets its own usable ordinary database; reserved service/database identities refuse before boot. Observed: the reserved predicate excludes certain role names, but not template0 or template1. Both are legal room usernames and pass the exact revised guestModule with no failing assertion. They are passed to ensureDatabases and ensureUsers with ensureDBOwnership=true. Those database names already exist in a freshly initialized PostgreSQL cluster, so NixOS skips their creation and ALTER DATABASE transfers their ownership to the normal login. HBA sameuser controls the connection's requested names; it does not turn a built-in template into a private user database.

Verified read-only reproductions: the shipped rooms.nix accepted demo.users.template0={uid=2100;keys=[fixture key];} with explicit sizes and extras=["postgresql-18"], returning {accepted=true;users=["template0"];}. Extracted the exact fenced guestModule from revised design.md and evaluated fixture assistant.extendModules with additional normal users template0 and template1 in turn. For each, failedAssertions=[]; ensureDatabases includes that name; ensureUsers includes {name=<template>;ensureDBOwnership=true;ensureClauses={};}. Pinned /nix/store/2s013d7g7sna6rls7nk0yy8343h6mdiw-source/nixos/modules/services/databases/postgresql.nix:914-917 skips CREATE DATABASE for an existing name and :102-104 unconditionally changes ownership when ensureDBOwnership=true.

Primary PostgreSQL 18 documentation (https://www.postgresql.org/docs/18/manage-ag-templatedbs.html) establishes that template0 normally has datallowconn=false and should remain unchanged, and that objects added to template1 are copied into subsequently created databases. Inference, not a live cluster observation: a template0 login cannot use its promised own database even though HBA matches; a template1 login receives control over the common source of future users' databases. This can also affect later user additions, which the current agent/eve/pg_demo fixture cases do not cover.

Repair: extend the capability's name/collision policy to reserve built-in database names, including template0 and template1, before ensureDBOwnership can act, and add positive/negative assertion cases with named reasons. Keep those restrictions scoped to this selected capability, as for F-6. The own-database-only choice and sameuser HBA need not be reopened. No VM/database was started or mutated."""
disposition = "fix-now"
response = "Accepted. sec-4 reserved list gains template0 and template1 (databases a fresh cluster holds, which ensureDBOwnership would hand over); sec-6 case 5 adds template1; case 8 mutation drops it from the list. Also in this revision, at the user's request: pg_hba uses samerole instead of sameuser so the operator can make a shared database (role NOLOGIN + database of that name + GRANT); sec-4 documents the guest-root -> runuser -u postgres path; VH step 6 tests it. DEC-063 amended."

