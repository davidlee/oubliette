detail = """
Raiser: codex. Blocks: no (major). Locus: .doctrine/slice/009/design.md:132-150/:152-172 and README commitment :292-299.

Expected: the newly supported operator-created shared role/database and later room-user declarations have a defined collision policy, so a declared normal login receives a usable database identity. Observed: the recipe creates `proj NOLOGIN`, which persists outside the declaration. The fragment later accepts a normal user named proj: it is not in the reserved list. NixOS's ensureUsers sees the existing proj role and skips CREATE USER; ensureClauses={} emits no ALTER ROLE LOGIN. ensureDBOwnership only reassigns the same database owner. The role therefore remains NOLOGIN, despite a healthy server/setup and a valid room declaration.

Concrete state transition: operator performs the allowed proj shared-database recipe; a subsequent image adds room.users.proj with its own uid/keys while retaining /home. Evaluation accepts it, but the new Unix login cannot connect as database role proj. Existing shared-role memberships also persist, so simply changing proj to LOGIN is not a deliberate separation of that shared identity from a new user's identity.

