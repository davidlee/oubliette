[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "Checking postgresql.service alone can report readiness before provisioning succeeds"
detail = """
Raiser: codex. Blocks: no (major). Locus: .doctrine/slice/009/design.md:134-137 and :201-207 (sec-4/sec-6), DEC-065.

Expected: the documented readiness check establishes that declared users can use their provisioned databases. Observed: `systemctl is-active postgresql` checks only the server process; the role/database provisioning runs in a different oneshot after that server is active. It can still be running or fail independently while postgresql.service remains active.

Verified evidence: pinned nixpkgs /nix/store/2s013d7g7sna6rls7nk0yy8343h6mdiw-source/nixos/modules/services/databases/postgresql.nix:743-749 makes postgresql.target require BOTH postgresql.service and postgresql-setup.service; :870-880 makes setup require/come after the server; :914-920 creates databases and roles in setup. The server only Wants that target (:757-763), so setup failure does not mean the server's active state represents successful provisioning. A read-only evaluation confirmed serverAfter=["network.target"], setupAfter=["postgresql.service"], and targetRequires=["postgresql.service","postgresql-setup.service"].

Inference, not a started-service observation: the first psql can race setup, and after a provisioning failure the prescribed readiness check can stay green permanently. Repair: document a check/wait that includes successful postgresql-setup completion (or the corresponding aggregate target) before the user connection, and distinguish process health from provisioning completion. This requires no oubliette readiness verb or service-specific front-end logic and preserves the settled no-new-verb choice."""
disposition = "fix-now"
response = "Accepted. sec-4 and sec-6 VH step 1: readiness is postgresql.target (server + postgresql-setup). DEC-065 amended; still no verb."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Accepted. sec-4 and sec-6 VH step 1: readiness is postgresql.target (server + postgresql-setup). DEC-065 amended; still no verb."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "VERIFIED at design/evaluation level against revised design.md:160-163/:247 and amended DEC-065. With the exact revised guestModule, read-only evaluation emitted postgresql.target with Requires=postgresql.service postgresql-setup.service; setup remains a oneshot with RemainAfterExit=true and After/Requires=postgresql.service (pinned postgresql.nix:743-749, :870-880). systemd.target default dependency semantics complement these Requires edges with After ordering unless disabled; no disabling is present (https://www.freedesktop.org/software/systemd/man/latest/systemd.target.html). Therefore checking the aggregate target on the documented fresh boot covers completion of setup as well as server startup, unlike the old server-only check. No new oubliette verb was added. No service started or failure injected; this is configuration/ordering evidence."

[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "Accepted room usernames can make PostgreSQL role provisioning fail after boot"
detail = """
Raiser: codex. Blocks: no (major). Locus: .doctrine/slice/009/design.md:104-117 (sec-4) and :187-193 (sec-6).

Expected: every accepted normal room user receives a usable same-named role/database, or the selection refuses with an explicit reason before boot. Observed: rooms.nix:68-69 accepts pg_demo, but PostgreSQL reserves role names beginning pg_. The fragment blindly maps that accepted login into CREATE USER. Other collisions such as the existing postgres OS/service identity also need a deliberate policy; the concrete counterexample here is pg_demo.

Verified reproductions: (1) a read-only evaluation of the shipped rooms.nix with demo.users.pg_demo={uid=2100;keys=[fixture key];}, ordinary explicit sizes and extras=["postgresql-18"] returned {accepted=true;users=["pg_demo"];}; (2) extending the fixture with the sec-4 module and that normal user produced an ensureUsers entry for pg_demo and failedAssertions=[]; no image was built. Pinned nixpkgs postgresql.nix:113 issues CREATE USER when the role is absent. PostgreSQL 18 upstream source rejects that exact namespace in src/backend/commands/user.c:334-343: https://github.com/postgres/postgres/blob/REL_18_STABLE/src/backend/commands/user.c#L334-L343 .

Inference: a fresh guest with this otherwise accepted declaration reaches a failed postgresql-setup, without the promised role. The current fixture only uses agent/eve, so its exact-name assertions do not cover this failure. Repair: define the admissible name/collision policy in the capability and enforce it at eval with a reason and a negative case (or design a deliberate role mapping if expanding the interface). Do not put PostgreSQL-specific restrictions on rooms that do not select PostgreSQL."""
disposition = "fix-now"
response = "Accepted. sec-4: the fragment's guestModule asserts no login is a reserved role name (pg_*, postgres, public, none, current_user, current_role, session_user), message names them; scoped to rooms selecting it. sec-6 case 5 (pg_demo). DEC-063 amended."

