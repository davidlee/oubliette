response = 'Accepted. sec-5 adds no-elevation rules (sudo extraRules == [], extraConfig == "", doas off) and states the guard is a regression guard over named settings, bounded by the oubliette-owned vocabulary (DEC-034); sec-6 case 7 is a NOPASSWD-grant module that must fail roomChecks. DEC-060 amended.'

[[finding]]
id = "F-4"
status = "answered"
severity = "major"
title = "The required dependency-removal mutation stays green under the specified checks"
detail = """
Raiser: codex. Blocks: no (major). Locus: .doctrine/slice/009/design.md:159-161 and :174-195 (sec-5/sec-6).

Expected: sec-6 case 6 drops x-systemd.requires and a case goes red. Observed: the specified persistence rules check only device, presence of "bind", and presence/absence of room-persist. None of cases 1-5 checks x-systemd.requires, the service's After/Requires home.mount, DefaultDependencies=false, or the before-local-fs ordering. Removing the dependency leaves every listed assertion unchanged. In particular a mere x-systemd.after orders an existing job; it does not pull the mkdir service into the transaction, and the design specifies no other activation edge for it.

Verified reproduction: a read-only evaluation constructed the design's bind/service on the fixture with fsType="none" (required to evaluate), then evaluated exactly the stated three persistence predicates. With options ["bind" "x-systemd.requires=room-persist.service" "x-systemd.after=room-persist.service"] the result was true; with ["bind" "x-systemd.after=room-persist.service"] the result was also true. Other listed fixture properties are unaffected. These were projections of the proposed predicates, not a run of an implemented fragmentsCases suite.

Inference: the mutated image can build with no job that creates a fresh bind source, and fail on a first boot while passing the stated structural checks. Repair: specify assertions over the actual dependency edges and early-service unit configuration, force the resulting fstab/unit representation where appropriate, and require the dependency-removal mutation to fail those assertions. Keep the live persistence/boot check separate: evaluation cannot prove it boots."""
disposition = "fix-now"
response = "Accepted. sec-5 persistence rules now assert the edges: x-systemd.requires in options, DefaultDependencies=false, home.mount in after and requires, local-fs.target in before; sec-3 says requires is what pulls the oneshot in. sec-6 case 8 requires the drop-requires mutation to go red."

