[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Peer identity does not enforce the promised cross-database refusal"
detail = """
Raiser: codex. Blocks: yes. Locus: .doctrine/slice/009/design.md:112-129 and :199-208 (sec-4/sec-6), DEC-063.

Expected: sec-6 VH step 5 refuses the second room user's connection to the first user's database. Observed in the design: only ensureDatabases, ensureDBOwnership and CREATEDB are configured, with NixOS's default `local all all peer`. Peer checks the requested ROLE against the connecting OS user, not whether the requested DATABASE belongs to that role. PostgreSQL grants CONNECT and TEMPORARY on databases to PUBLIC by default. Consequently `eve` connecting with `psql -U eve -d agent` is permitted by the proposed configuration; `eve` trying `-U agent` fails, but that tests impersonation, not database exclusion. No table-read access is implied by this finding.

Verified evidence: pinned nixpkgs /nix/store/2s013d7g7sna6rls7nk0yy8343h6mdiw-source/nixos/modules/services/databases/postgresql.nix:99-115 only creates/alters roles and changes database ownership; :688-704 supplies the unrestricted database HBA rule; :914-920 creates databases without revoking PUBLIC privileges. PostgreSQL 18 primary docs: https://www.postgresql.org/docs/18/ddl-priv.html (CONNECT/TEMPORARY defaults) and https://www.postgresql.org/docs/18/auth-peer.html (identity semantics). A read-only evaluation of the sec-4 module on the fixture produced databases [agent,eve] and only CREATEDB/ownership clauses, as written.

Inference, not a live connection result: VH step 5 fails with the proposed policy even when peer forwarding works perfectly. Resolve the intended boundary explicitly: implement and test database exclusion if retaining that acceptance criterion, including the policy for databases users create with CREATEDB and the postgres maintenance connection. If only identity separation was intended, reconcile the isolation claim and the negative test rather than letting a wrong-identity failure stand in for database exclusion. The live negative test must explicitly use the second user's own role and the first user's database."""
disposition = "fix-now"
response = "Fixed in the design (see prior response). Route demonstrate: proven live: sec-6 VH 5 and 6; pinned at build by fragmentsCases case 4 and the restore-'local all all peer' mutation."
route = "demonstrate"

