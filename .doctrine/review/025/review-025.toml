[[finding]]
id = "F-3"
status = "answered"
severity = "major"
title = "A module can grant passwordless guest root while every proposed door rule passes"
detail = """
Raiser: codex. Blocks: no (major). Locus: .doctrine/slice/009/design.md:60-62 and :148-157 (sec-2/sec-5); governing POL-001 limb 3 and DEC-034.

Expected: the claimed guard catches a vocabulary guestModule weakening the root-by-host-key-only boundary. Observed: all specified new checks concern two ssh settings and routing, and the existing user check restricts extraGroups, not sudo rules. A plain module setting `security.sudo.extraRules = [{ users = [ "agent" ]; commands = [{ command = "ALL"; options = [ "NOPASSWD" ]; }]; }];` grants the existing normal user unrestricted root without altering those settings, root's declared keys, autologin, the user's groups, DHCP, or any volume/repo property.

Verified reproduction: a read-only extendModules evaluation on the fixture assistant produced `agent ALL=(ALL:ALL) NOPASSWD: ALL` in security.sudo.configFile, while PasswordAuthentication=false, PermitRootLogin="prohibit-password", root's keys unchanged, autologin=null, defaultGateway=null, 10-capsule.gateway=[], 10-capsule.routes=[], and agent.extraGroups=["repos-read"] (the expected existing readers group). Existing predicates are at mkfleet.nix:232-244 and :293-314; vm/door.nix:72-86 states no sudo/su for the guest login. No sudo command was run, and roomImages itself was not rebuilt; passing the proposed guard follows directly from its enumerated predicates.

Repair: cover the privilege-elevation surfaces the guard promises to protect and add a deliberately weakening-module negative case; at minimum a direct sudo grant must not pass a claimed no-sudo invariant. Also distinguish this finite regression guard from a guarantee over arbitrary module effects: root keyFiles/AuthorizedKeysCommand, ssh Match blocks and alternate network declarations are not represented by the currently listed values. Keep the trusted, repository-owned fragment boundary; no consumer module escape hatch is requested."""
disposition = "fix-now"
response = "Contest accepted. Revised sec-5: vm/room.nix sets security.sudo.enable = false (rooms never had a sudoer), and the rule is the effective state: sudo, sudo-rs and doas enable all false. A granting module must re-enable one. sec-6 case 7 now runs the positive control first (both clean fixture rooms pass every roomChecks rule), then sudo.enable = true plus a NOPASSWD grant fails with the elevation rule and only it. DEC-060 amended."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = 'Accepted. sec-5 adds no-elevation rules (sudo extraRules == [], extraConfig == "", doas off) and states the guard is a regression guard over named settings, bounded by the oubliette-owned vocabulary (DEC-034); sec-6 case 7 is a NOPASSWD-grant module that must fail roomChecks. DEC-060 amended.'

[[finding.turn]]
act = "contest"
role = "raiser"
note = """
CONTEST. The finite-guard qualification in revised design.md:185-190 addresses the earlier overclaim, but the replacement predicates at :182-183 reject the unchanged fixture, so the substantive repair cannot pass its positive path. Read-only evaluations of the real fixture assistant (and the exact revised PostgreSQL guestModule) returned security.sudo.enable=true, extraRules containing the default root and wheel ALL/SETENV rules, extraConfig containing the harmless TERMINFO/TERMINFO_DIRS Defaults lines, and doas.enable=false. Thus `extraRules == [] && extraConfig == "" && !doas.enable` is false even with no weakening module. The injected NOPASSWD module is false too: the proposed case 7 can fail for the same reason as a clean room. A further read-only projection with sudo.enable=false made rulesEmpty=true but extraConfigEmpty remained false, so disabling sudo alone does not satisfy the current stated conjunction either.

Pinned source evidence: /nix/store/2s013d7g7sna6rls7nk0yy8343h6mdiw-source/nixos/modules/security/sudo.nix:219-260 adds root and wheel to extraRules whenever sudo is enabled; nixos/modules/config/terminfo.nix:89-100 contributes extraConfig when keepTerminfo is on. These are merged effective options, not consumer-only additions. Existing guest code does not disable sudo, and the revision specifies no such change.

Repair the positive and negative controls together: account for the pinned module's legitimate baseline when checking effective privilege policy, or explicitly disable the relevant elevation mechanism and assert the effective disabled state instead of requiring inert default fields to be empty. Require the clean assistant/lounge guard to pass before demonstrating that a genuinely enabling NOPASSWD mutation fails with the intended reason. No sudo command or room build was run; rejection of the unchanged fixture is directly observed by evaluation."""

