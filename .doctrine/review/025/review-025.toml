role = "raiser"
note = """
VERIFIED at design/evaluation level against revision de0f272, design.md:202-214/:258-260 and amended DEC-060. Projected security.sudo.enable=false into both real fixture room modules. Read-only evaluations returned sudo=false, sudo-rs=false, doas=false, proposed guardPass=true, failedAssertions=[], and no sudo/sudoedit wrapper for both assistant and lounge. Both complete system.build.toplevel derivations also evaluated (no build). A grant-only module leaves sudo disabled and creates no wrapper, correctly remaining inert. A deliberately forced re-enable plus agent NOPASSWD grant returned guardPass=false and restored sudo/sudoedit wrappers; the negative case must use an effective override such as mkForce true to reach the named guard rather than an equal-priority merge conflict.

Checked dependency concerns: runuser remains on the guest system path (pinned nixpkgs nixos/modules/config/system-path.nix:38), and its PAM rootOK=true/unixAuth=false defaults remain present independently of sudo (nixos/modules/security/pam.nix:2754-2758). room-seed still runs as root and invokes runuser through its own util-linux path (vm/room.nix:168-177/:194-197). session directly execs commands (vm/session.nix:64-70). PostgreSQL service and setup select User=postgres through systemd (pinned postgresql.nix:787-788/:876-880). Host CLI sudo/systemctl calls run on the host and are unaffected by this guest option. No dependency on guest sudo was found in these paths. Root's SSH key path is unchanged. These are source/evaluation checks, not a boot, PAM login, sudo execution, or an implemented new roomChecks suite."""

