[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "install -d does not create the private parent hierarchy the design promises"
detail = """
Raiser: codex. Blocks: no (minor). Locus: .doctrine/slice/009/design.md:70-82 and :235-236 (sec-3/sec-8).

Expected: /home/.fragments and all intermediate parents are root-owned 0700, outside users' reach, and the service retains management of its persisted state directory. Observed: `install -d -m 0700 /home/.fragments/<name><path>` applies the requested mode to the named leaf, while newly created parents get 0755 regardless of -m/umask. On the first boot /home/.fragments is therefore traversable/listable, contrary to the stated privacy boundary. GNU install also applies default root ownership and the requested mode to an existing named directory on subsequent boots.

Verified primary semantics: https://www.gnu.org/software/coreutils/manual/html_node/install-invocation.html documents parent mode 0755, default owner root, and resetting named-directory attributes. Pinned nixpkgs postgresql.nix:787-788 and :847-850 sets User/Group=postgres and StateDirectory="postgresql postgresql/18". systemd's documented StateDirectory ownership handling recursively changes a tree when the configured owner/group differs: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#RuntimeDirectory= .

Inference: after PostgreSQL has owned the bind root, the next boot's install resets it to root, causing an avoidable recursive ownership traversal of the entire cluster at startup. Its duration is unmeasured; no direct table-file disclosure is claimed, since PostgreSQL's own leaf permissions still apply. Repair: explicitly create/secure the private root parent, and create a missing source leaf without resetting an existing service-owned tree. Keep service StateDirectory responsible for its own ownership. Add a repeat-start/mode assertion to the directory-creation coverage."""
disposition = "fix-now"
response = "Accepted. sec-3: umask 077 then mkdir -p (parents 0700 root), the leaf created only when missing so a postgres-owned tree is never reset; VH steps 1 and 3 read the modes and ownership across a restart."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Accepted. sec-3: umask 077 then mkdir -p (parents 0700 root), the leaf created only when missing so a postgres-owned tree is never reset; VH steps 1 and 3 read the modes and ownership across a restart."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "VERIFIED as a corrected construction in revised design.md:71-77/:247-252. The new script uses umask 077 and mkdir -p, creates missing source leaves only, and no longer calls install/chown/chmod on an existing service-owned tree. Consulted the installed GNU coreutils 9.11 primary manual with `info --output=- '(coreutils) mkdir invocation'`: -p ignores existing parents without changing their permissions, and parent modes are controlled by the umask. For a fresh root-owned hierarchy, the specified 077 yields 0700; subsequent boots leave the existing postgres-owned leaf intact. VH now explicitly checks the private parent's mode and persisted ownership across restart. No directory-creation script, ownership change or live restart was executed in this pass; design semantics verified, live checks remain required as stated."

[[finding]]
id = "F-8"
status = "verified"
severity = "minor"
title = "tryEval cannot prove the capsule refused for the promised reason"
detail = """
Raiser: codex. Blocks: no (minor). Locus: .doctrine/slice/009/design.md:174-183 (sec-6 case 2); CLAUDE.md's force-and-pin-the-reason convention and POL-004 verification rules.

Expected: evaluating a capsule with the capability fragment proves it throws the slotRefusal message at the call site, not an unrelated refusal. Observed: the suite is specified as tryEval over deepSeq, with each verdict carrying its reason. Nix's tryEval returns only {success;value;}; on a caught throw the error text is discarded. Computing slotRefusal's string separately proves the helper's reason, not that the capsule threw that string. An unrelated catchable throw in the capsule can satisfy the same negative verdict.

Verified read-only reproduction: `nix eval --offline --impure --json --expr 'builtins.tryEval (throw "unrelated failure")'` returns {"success":false,"value":false}. Existing fragments.nix:119-122 already contains an independent throw path; the new capsule guard has not been implemented in this review. No implemented suite is claimed to have run.

Repair: state how the integration case observes the actual refusal reason, for example a bounded nix-eval subprocess whose nonzero result and diagnostic are checked, or a shared structured reason selected at the actual capsule guard with a positive-control evaluation. Mutate the guard to an unrelated throw and require that case to fail. Do not count comparing the helper's separately computed reason as observing the call site's diagnostic."""
