[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "Peer identity does not enforce the promised cross-database refusal"
detail = """
Raiser: codex. Blocks: yes. Locus: .doctrine/slice/009/design.md:112-129 and :199-208 (sec-4/sec-6), DEC-063.

Expected: sec-6 VH step 5 refuses the second room user's connection to the first user's database. Observed in the design: only ensureDatabases, ensureDBOwnership and CREATEDB are configured, with NixOS's default `local all all peer`. Peer checks the requested ROLE against the connecting OS user, not whether the requested DATABASE belongs to that role. PostgreSQL grants CONNECT and TEMPORARY on databases to PUBLIC by default. Consequently `eve` connecting with `psql -U eve -d agent` is permitted by the proposed configuration; `eve` trying `-U agent` fails, but that tests impersonation, not database exclusion. No table-read access is implied by this finding.

Verified evidence: pinned nixpkgs /nix/store/2s013d7g7sna6rls7nk0yy8343h6mdiw-source/nixos/modules/services/databases/postgresql.nix:99-115 only creates/alters roles and changes database ownership; :688-704 supplies the unrestricted database HBA rule; :914-920 creates databases without revoking PUBLIC privileges. PostgreSQL 18 primary docs: https://www.postgresql.org/docs/18/ddl-priv.html (CONNECT/TEMPORARY defaults) and https://www.postgresql.org/docs/18/auth-peer.html (identity semantics). A read-only evaluation of the sec-4 module on the fixture produced databases [agent,eve] and only CREATEDB/ownership clauses, as written.

Inference, not a live connection result: VH step 5 fails with the proposed policy even when peer forwarding works perfectly. Resolve the intended boundary explicitly: implement and test database exclusion if retaining that acceptance criterion, including the policy for databases users create with CREATEDB and the postgres maintenance connection. If only identity separation was intended, reconcile the isolation claim and the negative test rather than letting a wrong-identity failure stand in for database exclusion. The live negative test must explicitly use the second user's own role and the first user's database."""
disposition = "fix-now"
response = "Accepted. User chose own-database-only (2026-10-24). sec-4: authentication mkForce to 'local all postgres peer map=postgres' then 'local sameuser all peer' (NixOS's default is mkAfter, so a prepended rule would leave 'local all all peer' as fallback); CREATEDB dropped. sec-6 VH step 5 now eve's own role against agent's database; case 4 pins the two rules; mutation restores 'local all all peer'. DEC-063, DEC-059 amended."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Accepted. User chose own-database-only (2026-10-24). sec-4: authentication mkForce to 'local all postgres peer map=postgres' then 'local sameuser all peer' (NixOS's default is mkAfter, so a prepended rule would leave 'local all all peer' as fallback); CREATEDB dropped. sec-6 VH step 5 now eve's own role against agent's database; case 4 pins the two rules; mutation restores 'local all all peer'. DEC-063, DEC-059 amended."

[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "The rendered persistence filesystem is missing required fsType"
detail = """
Raiser: codex. Blocks: no (major). Locus: .doctrine/slice/009/design.md:68-77 (sec-3).

Expected: the specified fileSystems bind can be evaluated into a guest fstab. Observed: its complete described rendering gives device and options, but no fsType. In this pinned nixpkgs, fileSystems.<name>.fsType is mandatory, with no default (nixos/modules/tasks/filesystems.nix:124-132 under /nix/store/2s013d7g7sna6rls7nk0yy8343h6mdiw-source).

Verified reproduction: read-only `nix eval --offline --impure --json --expr` extended `(builtins.getFlake "git+file:///home/david/dev/oubliette").nixosConfigurations.assistant` with the sec-3 fileSystems entry and room-persist service. Forcing the resulting filesystem failed: `The option fileSystems."/var/lib/postgresql".fsType was accessed but has no value defined.` Adding fsType = "none" made that same projection evaluate. This did not build any image.

Repair: include an explicit suitable bind fsType, such as "none", in the generic rendering and its evaluated coverage. For context, the successful projection reports neededForBoot=false for this bind; /home is also neededForBoot=false, with device /dev/vdb, and boot.initrd.systemd.enable=true. Pinned microvm source /nix/store/zlsnwkdg1qsc70657sra23nf5k2dy7cy-source/nixos-modules/microvm/mounts.nix:103-117 does not mark this /home volume neededForBoot. Thus the current pin supports a stage-2 home.mount design; no boot-order cycle is asserted here. Its actual boot was not exercised."""
disposition = "fix-now"
response = """Accepted. sec-3: fsType = "none"; sec-5 persistence rules assert it. Your eval's stage-2 finding (/home not neededForBoot) recorded in sec-3."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """Accepted. sec-3: fsType = "none"; sec-5 persistence rules assert it. Your eval's stage-2 finding (/home not neededForBoot) recorded in sec-3."""

[[finding]]
id = "F-3"
status = "answered"
severity = "major"
title = "A module can grant passwordless guest root while every proposed door rule passes"
detail = """
Raiser: codex. Blocks: no (major). Locus: .doctrine/slice/009/design.md:60-62 and :148-157 (sec-2/sec-5); governing POL-001 limb 3 and DEC-034.

Expected: the claimed guard catches a vocabulary guestModule weakening the root-by-host-key-only boundary. Observed: all specified new checks concern two ssh settings and routing, and the existing user check restricts extraGroups, not sudo rules. A plain module setting `security.sudo.extraRules = [{ users = [ "agent" ]; commands = [{ command = "ALL"; options = [ "NOPASSWD" ]; }]; }];` grants the existing normal user unrestricted root without altering those settings, root's declared keys, autologin, the user's groups, DHCP, or any volume/repo property.

Verified reproduction: a read-only extendModules evaluation on the fixture assistant produced `agent ALL=(ALL:ALL) NOPASSWD: ALL` in security.sudo.configFile, while PasswordAuthentication=false, PermitRootLogin="prohibit-password", root's keys unchanged, autologin=null, defaultGateway=null, 10-capsule.gateway=[], 10-capsule.routes=[], and agent.extraGroups=["repos-read"] (the expected existing readers group). Existing predicates are at mkfleet.nix:232-244 and :293-314; vm/door.nix:72-86 states no sudo/su for the guest login. No sudo command was run, and roomImages itself was not rebuilt; passing the proposed guard follows directly from its enumerated predicates.

Repair: cover the privilege-elevation surfaces the guard promises to protect and add a deliberately weakening-module negative case; at minimum a direct sudo grant must not pass a claimed no-sudo invariant. Also distinguish this finite regression guard from a guarantee over arbitrary module effects: root keyFiles/AuthorizedKeysCommand, ssh Match blocks and alternate network declarations are not represented by the currently listed values. Keep the trusted, repository-owned fragment boundary; no consumer module escape hatch is requested."""
disposition = "fix-now"
response = 'Accepted. sec-5 adds no-elevation rules (sudo extraRules == [], extraConfig == "", doas off) and states the guard is a regression guard over named settings, bounded by the oubliette-owned vocabulary (DEC-034); sec-6 case 7 is a NOPASSWD-grant module that must fail roomChecks. DEC-060 amended.'

