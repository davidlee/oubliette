id = "F-1"
status = "verified"
severity = "major"
title = "Governance records still place a target in oubliette's flake.nix (expected: consumer's mkFleet call)"
detail = """
Expected (design sec-8): POL-002, POL-003, POL-001 scope, POL-004, DEC-017, DEC-018, DEC-020, CON-001 and an ISS-015 note reworded to the post-SL-004 layout.
Observed (`doctrine show`):
- POL-002:40-42,83-84 — a target's name may appear "only in targets/, in flake.nix's target inputs and its targetFlakes map, as probeTarget in flake.nix, and a slot's profile in capsules.nix". Oubliette has none of these now; the list should be "a consumer flake, plus fixture/ and templates/", inputs.doctrine (governance CLI) excluded.
- POL-003:14-18,49-50,76,87 — `net` in flake.nix, slots in capsules.nix, targetFlakes in flake.nix with DEC-019's throw, probeFabric in flake.nix, workBranch in flake.nix.
- POL-004:17,58,81 — call sites in flake.nix (now mkfleet.nix).
- POL-001 — scope does not say the consumer holds policies and allowlists.
- DEC-017 "flake.nix throws"; DEC-018 "flake.nix is the only place that binds this host's values"; DEC-020 ".#capsule names doctrine's image until IMP-015 gives probes a fixture target" (now true); CON-001 applies_to flake.nix / extras in flake.nix.
- ISS-015:28 "Considered and not taken: an in-repo placeholder target" — now taken (fixture/).
"""
disposition = "design-wrong"
response = """
Governance wording follows the boundary move. Reconciliation Brief, Governance/spec: REV modify POL-001 (scope), POL-002 (search rule), POL-003 (homes, Verification), POL-004 (call sites), DEC-017, DEC-018, DEC-020, CON-001; an ISS-015 note.
"""

