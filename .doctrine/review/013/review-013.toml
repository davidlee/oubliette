[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "Design sec-7 step 8's ~/flakes wiring is wrong in two places (expected: what was applied)"
detail = """
Expected: design sec-7 step 8 states the ~/flakes edits exactly (EX-3 of PHASE-09 asks for them "exactly as design sec-7 gives them").
Observed (notes PHASE-09 T5 step 4, commit f54ae80):
- The shims `doctrine.follows`/`goad-walk.follows = "nixpkgs"` break the module: capsule-perimeter evaluates each target's guest image, which reads the target flake's `packages` → "attribute 'packages' missing". Applied instead: `fleet = { url = …; inputs.nixpkgs.follows = "nixpkgs"; }` with no target shims.
- `justfile:14 --override-input fleet git+file:///srv/fleet` is stale: the override now comes from `bin/dev-checkouts`, with `fleet` resolving to `$FLAKES_FLEET` (default /srv/fleet).
- slice-004.md "Settled with the user": "The follows shims move onto that input; they do not disappear" — false for the same reason.
Also the design's line ref `~/flakes/flake.nix:193` is :189.
"""
disposition = "design-wrong"
response = """
The applied wiring is the truth; the design was written before the module's dependence on target packages was seen. Reconciliation Brief, per-slice: design.md sec-7 step 8 (no target shims and why; override via bin/dev-checkouts/$FLAKES_FLEET; flake.nix:189) and slice-004.md "Settled with the user" (shims do not move; they go).
"""

