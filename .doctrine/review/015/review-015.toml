[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "GPT F-1: session's per-room render carries target names and guestPaths, against POL-002's program clause"
detail = "Source: GPT (gpt-6-sol) document-level pass, 2026-10-18. sec-3/DEC-049 generate session as a writeShellApplication with the repo table rendered per room image. POL-002: 'No program carries a target's values or its name — except a host-declared value threaded into the generated front end'. Remedy proposed: generic launcher reading a room data file, or revise the policy."
disposition = "fix-now"
response = "Observation sound in letter: the policy's program clause is written about host capsule-<verb> programs, and the guest already bakes target values (vm/capsule.nix seed/motd), but a generic launcher costs almost nothing and removes the question. User chose (2026-10-18) a generic session over a rendered /etc/room/repo/<repo>/{clone,tools} tree: sec-3, sec-1 diagram, sec-11, sec-8 sessionCases (handed a fixture root); DEC-049 choice and rationale amended. Not widened: room-seed still carries guestPath in its unit script, as vm/capsule.nix:278 does — NixOS unit config, not a pinned program."

