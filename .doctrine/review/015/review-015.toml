[[finding]]
id = "F-6"
status = "answered"
severity = "major"
title = "GPT F-6: a valid target name can be an unusable room repo"
detail = "profile-name.nix permits any name without / newline tab $ backtick (e.g. foo+bar); checkToken (quarantine.nix:93) permits only [A-Za-z0-9._-]+. sec-2 refuses no mismatch at eval, so the room builds and push/collect refuse at run time."
disposition = "fix-now"
response = "Verified (profile-name.nix vs quarantine.nix:93). sec-2 gains an eval refusal for a repo target outside [A-Za-z0-9._-]+ or . / ..; session holds the same rule for its argument."

