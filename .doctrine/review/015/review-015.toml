[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "GPT F-2: branch is unvalidated (collect '*' fetches every head) and push resolves the branch after pre-flight (a caller error reads as 75)"
detail = "sec-4 checks only room/repo tokens; +refs/heads/<branch> with branch '*' is a glob refspec (git-channel.nix:539 uses the same glob deliberately for slots). Order of a run puts rev-parse (step 3) after the banner (step 2), so a missing branch with the room down exits 75, and sec-8's 'push of a branch the host checkout lacks -> 2' is unreachable in a sandbox, where there is no socket."
disposition = "fix-now"
response = "Verified (git-channel.nix:539 uses the glob; step order put rev-parse after the banner, making sec-8's absent-branch case unreachable with no socket). sec-4 step 1 now refuses a branch git check-ref-format --branch refuses (which rejects * ? [) and resolves push's oid before the pre-flight; sec-8 roomGitCases pins both, the absent branch as 2 with no socket. DEC-045 choice amended."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Verified (git-channel.nix:539 uses the glob; step order put rev-parse after the banner, making sec-8's absent-branch case unreachable with no socket). sec-4 step 1 now refuses a branch git check-ref-format --branch refuses (which rejects * ? [) and resolves push's oid before the pre-flight; sec-8 roomGitCases pins both, the absent branch as 2 with no socket. DEC-045 choice amended."

[[finding]]
id = "F-3"
status = "answered"
severity = "major"
title = "GPT F-3: capsule-room-git on the module path must be wrapped like provision/collect"
detail = "sec-11 says services.nix installs capsule-room-git, not that it is wrapped. Bare, quarantine.nix's fragment falls back to $root/.vm/host for state (and the known_hosts store under it) and profileDir() to the store's baked document (services.nix ~828-850, ISS-004). Remedy: wrap it; pin in hostModuleUnits."
disposition = "fix-now"
response = "Verified (services.nix wraps provision/collect for this reason, ISS-004). sec-4 adds 'On the module path it is wrapped'; sec-11 services.nix installs through wrap; sec-8 hostModuleUnits pins the installed program is the wrapped one."

