id    = 1
slug  = "design-review-of-sl-002"
title = "design review of SL-002"
# no status — a review's status is DERIVED from its findings (ADR-007 D-C8), so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
concluded = true

[target]                   # the outbound `reviews` edge (ADR-004): RV-NNN ──reviews──▶ <ref>
ref   = "SL-002"

[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "sec-3: a failed clone commit unmarks an earlier unscrubbed clone"
detail = "sec-3 clone step 6 removed the scrub marker whenever the final mv failed. With a marker already present from an earlier, still-unscrubbed clone onto the same destination, a second clone whose move fails deletes that marker while the destination image still carries the first source's identity: no scrub will run, so the identity leaks. Also: --identity over a leftover marker left it in place, scrubbing what the operator asked to keep."
disposition = "fix-now"
response = "sec-3 clone step 5 writes the marker only if absent and remembers that it did; step 6 removes it on a failed commit only if this run wrote it; step 7 has --identity remove any marker after a successful commit. A crash table states the invariant per interruption point. sec-8 adds cases for a pre-existing marker across a failed commit and for --identity, each with a mutation. Commit 075ead9."

[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "sec-3: the marker's record directory may be absent, and root must not create it"
detail = """/var/lib/capsule/slot/<slot>/ is made by the operator's first record write (david:users 0750), not by create, so a created-but-never-set-up slot has none. The helper writing the marker there fails; creating it as root would refuse every later record write. Step 1's "destination's state directory" was also ambiguous between the image root and the record root."""
disposition = "fix-now"
response = """sec-3 step 1 names both roots: created(dest) is host/cli.nix's created test, and the helper refuses when the record directory is absent and never creates it. sec-7 has the front end mkdir -p "$(slotDir dest)" as the operator before calling the helper; sec-5's sequence shows it. sec-8 cases pin both. Commit 075ead9."""

[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "sec-3: a crash mid-copy leaves an unreclaimable temporary image"
detail = "The temporary copy was capsule-work.img.clone-$$. A crash during cp leaves gigabytes nothing reclaims (the next run has another pid) and alloc does not show. Also --reflink=never is moot: /var/lib/microvms is ext4."
disposition = "fix-now"
response = "sec-3 step 4 uses the fixed name capsule-work.img.clone and removes any leftover before copying (safe: step 2's fuser showed the destination unused). --reflink=never dropped. sec-8 case added. Commit 075ead9."

[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "sec-8: two root-helper cases cannot be built in a sandbox"
detail = '"A fixture filesystem sized to force it" needs a mount a nix build sandbox cannot make, and the "crash between marker and move" mutation has no hook. df and mv come from runtimeInputs, so a suite cannot shadow them on PATH. The verification the design claimed was not implementable as written.'
disposition = "fix-now"
response = "The helper takes a build-time tools fragment (freeBytes, commitImage), host/cli.nix guestControl's shape; build-time, so still not pointable at run time. sec-8 stubs freeBytes for the fit refusal and commitImage to fail unless the marker exists, so moving the marker write after the commit turns that case red. Commit 075ead9."

[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "sec-4: sshd does not regenerate a missing host key on start"
detail = "On the pinned nixpkgs (ef34387) host keys are generated by sshd-keygen.service, a oneshot with no RemainAfterExit and ConditionFileNotEmpty on the declared keys, not by sshd. A restart of sshd likely pulls it in through wants, but the design stated a mechanism that does not exist. sec-5 also did not say why inject still connects after the key changes."
disposition = "fix-now"
response = "sec-4 --scrub starts sshd-keygen by name, then restarts sshd, and states the unit facts; resetHomeCases asserts that order. sec-5 states the admin door does not check host keys (host/guest-ssh.nix:48-50). ASM-002 narrowed to session survival; live exercise 3 reads the new key's fingerprint. Commit 075ead9."

[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "sec-3: image checks race a concurrent start or a second helper run"
detail = "Raised by Codex adversarial review. fuser is a point-in-time check: a start between it and rm/cp/mv lets a VMM run on an unlinked image or be snapshotted mid-write. Two concurrent clones onto one destination share the fixed temporary name capsule-work.img.clone (introduced by the F-3 fix), and two concurrent clones can both pass the free-space check. Codex prescribes per-slot locks held by every image opener for the VMM's lifetime."
disposition = "fix-now"
response = "Observation correct; the shared temporary name is a regression from the F-3 fix. Prescription narrowed (user's ruling): the root helper holds one host-wide exclusive flock for its whole run, serialising helper runs (temporary file, capacity check, marker); `capsule <slot> start` takes the same lock shared around `systemctl start` and its stays-up check. A bare `systemctl start` typed by hand bypasses it and is stated as a boundary, as `capsule-inject` off PATH is. Lifetime locks on every image opener rejected: they require changing the microvm runner and unit, and the start lock covers the route the front end owns. To integrate into sec-3, sec-5/7, sec-8 (start-vs-helper and helper-vs-helper cases)."

[[finding]]
id = "F-7"
status = "verified"
severity = "major"
title = "sec-4: reset-home can delete $HOME under agent processes its idle check cannot see"
detail = "Raised by Codex adversarial review. The idle check reads logind sessions only and excludes the serial console's. Processes under the agent's user manager (user@1000.service) belong to no session; a human may be using the console; a login can arrive between the check and the delete. Codex prescribes a maintenance transaction: block logins, stop the console getty, terminate the agent's sessions and user manager, verify no agent process remains, reset, restore."
disposition = "fix-now"
response = '''Observation correct, verified by spike on slot b. Prescription adopted in part (user's ruling). reset-home keeps DEC-004's refusal on any agent session whose Service is not a getty login, then quiesces: note and stop system-getty.slice and system-serial\x2dgetty.slice, stop user-1000.slice (synchronous, measured 51ms, leaves no agent process), refuse unless the slice is inactive, reset, then fail loudly if the slice became active during the reset; a trap restarts the noted gettys. The slice replaces a pgrep test. The console-in-use sub-point is contested: on the module path the serial console goes to the unit's journal and no verb attaches it. Blocking logins with /etc/nologin is not adopted: the guest's sshd runs UsePAM yes with no pam_nologin in its stack, and OpenSSH skips its own nologin check under PAM (session.c:1502), so it would need a guest PAM change; filed as a backlog improvement. To integrate into sec-2, sec-4, sec-8.'''

[[finding]]
id = "F-8"
status = "verified"
severity = "major"
title = "DEC-010's premise fails: a warm sudo ticket removes the password prompt"
detail = "Raised by Codex adversarial review. DEC-010 counts the sudo password prompt as the second keystroke for reset and clone-from. A cached sudo ticket removes the prompt (NOTES item 41 records a root step succeeding under a ticket a minutes-earlier just up left warm), so a declared, stopped, wrong slot is destroyed immediately. Codex prescribes a confirmation bound to the slot: a typed name, or --confirm <slot> for composition."
disposition = "design-wrong"
response = "Correct, and the design guarantees it: reset needs the slot stopped, and `capsule <slot> stop` runs `sudo systemctl stop` (host/cli.nix:1486), so the ticket is warm by construction. User's ruling: the front end invokes the helper with `sudo -k`, which ignores cached credentials, always prompts, and does not refresh the ticket (man sudo). DEC-010 stands with its premise made true; its IMP-010 consequence is unchanged. Typed-slot confirmation not adopted. To integrate into sec-3 (invocation), sec-7 (volumeControl default), sec-8 (case: the helper call carries -k), and DEC-010's context."

[[finding]]
id = "F-9"
status = "verified"
severity = "blocker"
title = "sec-3: a clone may consume every non-root byte, and a failed copy leaves its temporary image"
detail = "Raised by Codex adversarial review; sharpened by the user (the filesystem becomes unwritable at about 95%, the ext4 root reserve). The fit check allows alloc up to df's avail with no reserve. The copy runs as root, so it completes, but afterwards avail is zero for every non-root writer, including running VMMs growing their sparse images. Concurrent clones can both pass the check. cp failing with ENOSPC leaves capsule-work.img.clone in place, because cleanup exists only for a failed commit. Codex prescribes a declared reserve, serialized capacity checks, and an EXIT cleanup."
disposition = "design-wrong"
response = """Correct, and worse than raised. Measured 2026-09-15 on /var/lib/microvms (ext4): 107 GiB avail to non-root, about 100 GiB more held in the root reserve (the user's "unwritable at 95%"). Root's cp completes; afterwards VMMs (user microvm) growing sparse images get ENOSPC. sec-3's "no margin, a margin has no declared home" was wrong: the answer is to declare one. User's ruling: a pool-level reserve in capsules.nix, 20 GiB, passed to the helper at build time; refuse unless allocated + reserve <= non-root avail. Concurrent clones serialised by F-6's lock. Fix-now part: an EXIT trap removes an uncommitted temporary image on any failure, not only a failed commit. Pre-existing sparse overcommit (five 32 GiB images could outgrow avail without any clone) is filed separately. To integrate into sec-3, sec-6 (free line may show the reserve), sec-8."""

[[finding]]
id = "F-10"
status = "verified"
severity = "blocker"
title = "sec-2/sec-4: the guest autologins agent on tty1 as well as ttyS0, so the idle check always refuses"
detail = "Found by the F-7 spike on slot b (2026-09-15). services.getty.autologinUser applies to every getty: loginctl showed agent sessions on ttyS0 (serial-getty@ttyS0.service) and on seat0/tty1 (getty@tty1.service). sec-2 and sec-4 exclude only the ttyS0 session, so the tty1 session makes reset-home refuse on every guest. After a stop of user-1000.slice with only the ttyS0 getty stopped, getty@tty1 logged agent in again within 5s, so a quiesce that stops one getty does not hold either."
disposition = "fix-now"
response = "The idle test no longer names a TTY: it excludes agent sessions whose logind Service is the getty login, whichever tty they are on, and refuses on any other (ssh sessions, and a detached baseline's per ASM-001). The quiesce stops both getty slices rather than one unit, so no autologin can respawn a session during the reset. To integrate into sec-2, sec-4, sec-8, with a live exercise reading the Service property of each session kind."

