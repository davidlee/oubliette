[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Expected sec-6's reachability probe to keep DEC-050's split between down and distrusted; observed `capsule <room> ssh <user> true` collapses them"
detail = """
design sec-6, `GitChannel.reachable`: "exit 75 from either verb, or `capsule <room> ssh <user> true`".

The ssh door does not speak DEC-050's statuses: no socket exits 1 (host/cli.nix:1939-1943, phase-07 A13 `13-ssh` rc 1), a changed host key exits 255 (A11 `11-ssh`), and the human door carries no `BatchMode` (cli.nix roomDoor's comment: "No `BatchMode`, since a human is at it"), so a runner without an agent-held key can block on a prompt. A runner that treats "ssh true failed" as unreachable reads a trust failure as downtime — the conflation DEC-050 exists to prevent. The 75 half of the row is sound; the "or" alternative is not an equivalent."""
disposition = "design-wrong"
response = """The front end's human door is right to be interactive (no BatchMode) and to say "not up" as 1, as every slot door does; it is the interface row that offers it as an equivalent probe. Reconcile brief: design sec-6's `GitChannel.reachable` row — 75 from either channel verb is the reachability answer; drop the `ssh <user> true` alternative, or state that it does not distinguish down (1) from distrusted (255) and may prompt. The relay to satan SL-023 is the user's act; reconcile notes the correction for it."""

