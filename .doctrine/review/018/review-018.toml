[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Expected sec-4 step 1 and sec-6 to describe the channel that shipped; observed the profile reader, the extra refusals and the stdout shapes differ"
detail = '''
Departures recorded in the phase sheets (phase-04 D2/OQ-4, phase-06's departure table), none yet in design.md:

1. sec-4: "`--profile` is the existing reader (`host/profile.nix` `select`)". Shipped: `profileLoad` behind `refuseToken 2` (host/room-git.nix:42-44, :186) — `select` exits 1 and falls back to `CAPSULE_PROFILE`, both against the 2-before-the-door rule and DEC-041's argv-only naming. DEC-045 says "the existing reader" and is not wrong.
2. sec-4 step 1 lists usage, token, policy, `may`, branch, push rev-parse. Shipped also refuses (2): `--user` not a login name (room-git.nix:167), a state root holding whitespace or `%` (`refuseOddState`, :93-100); the branch passes `check-ref-format --branch` *and* `refs/heads/<branch>` (inside a repo `--branch` expands `@{-1}`); push resolves `refs/heads/<branch>` exactly (so a same-named tag is never sent); `--` ends the options.
3. stdout: sec-4 step 4 says collect prints "the ref and its oid"; shipped prints `<oid>\t<ref>` (ls-remote order, room-git.nix:24-27, :256), and the code's header says the line is outward-facing to satan SL-023. sec-6's `GitChannel.collect` row names the ref but not the line's shape — the relay is what satan parses.'''
disposition = "design-wrong"
response = '''Each departure is a tightening that keeps the design's own rules (2 before the door, argv only); the code is right. Reconcile brief: design sec-4 — `profileLoad` behind `refuseToken 2` in place of `select`, with why; step 1's full refusal list (`--user` login name, odd state root, both ref-format checks, `refs/heads/<branch>` exactly, `--` ends options); step 3/4's stdout lines, push `<oid>`, collect `<oid>\t<ref>`. Design sec-6's `GitChannel.refresh`/`collect` rows state those two stdout shapes, since satan parses them.'''

