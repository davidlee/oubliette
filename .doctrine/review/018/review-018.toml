status = "verified"
severity = "nit"
title = """Expected the live rung to exercise a post-banner authentication failure; observed only the host-key half of DEC-050's "1 after the banner""""
detail = """
Plan PHASE-07 VA-1 lists push, a session commit, collect into the right quarantine, 75 with the room stopped, host-key refusal and recovery, stop/start persistence and a slot collect: each is observed in phase-07's Findings (A4-A15). Not exercised live, as the harvest says: a wrong-repo collect (`09-wrong` skipped), socket-present-no-banner (suite only), an authentication failure, an oversize pack (quarantineCases only), a build through `session`.

Of those, only the authentication failure is covered by neither the live rung nor a suite with a real sshd: roomGitCases' talker door proves a post-banner failure is 1, not that sshd's refusal of a key is. It is not a plan criterion; recorded so it is not mistaken for proven."""
disposition = "tolerated"
response = """Not a plan criterion, and the gap is narrow: the program's branch for it is the same `|| { …; exit 1; }` after the banner that A11's host-key failure took live and the talker case takes in the suite, so what remains unproven is sshd's behaviour, not this program's. Producing it live needs a key the room refuses, which is the user's act on the live host for little discrimination. Recorded in the synthesis's "not exercised" list so nothing reads it as proven."""

