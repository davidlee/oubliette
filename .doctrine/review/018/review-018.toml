[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Expected sec-8 and DEC-050 to say which branches a case reaches; observed both say the banner and post-banner branches are live-only, while roomGitCases reaches them"
detail = """
design sec-8: "Not reachable by a case (ssh cannot be stubbed): the banner branch, an auth or host-key failure → 1". DEC-050 consequences: "the banner and auth branches are proven live, since ssh cannot be stubbed".

host/room-git-cases.nix:268-295 serves a fixture door on a socket: a silent door → 75 "no ssh banner"; an HTTP reply → 75; an `SSH-2.0-fixture` banner then nothing → 1 for push and for collect, plus a timing case that the pre-flight stops at the banner (readbytes=8, < 3000 ms) and a check that nothing is written to state before the banner.

ssh itself is still unstubbable (it is a runtimeInput); what changed is that the *door* is. What stays live-only is narrower: authentication and host-key failure through a real sshd (phase-07 A11 observed the host-key half; auth was not exercised). The design and DEC-050 overstate what only the live rung can prove."""
disposition = "design-wrong"
response = """The suite is better than the design predicted, so the design and DEC-050 under-claim what a case can reach. Reconcile brief: design sec-8's "Not reachable by a case" paragraph and its roomGitCases row (the door is fakeable; ssh is not), and DEC-050's consequences ("cases pin no socket => 75, no banner => 75 and a post-banner failure => 1 with a fixture door; authentication and host-key refusal through a real sshd are proven live")."""

