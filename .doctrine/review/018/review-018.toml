[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Expected one answer on whether a room's base PATH carries git; observed DEC-043 and the contract promise it while design sec-6 says a non-login PATH is not promised"
detail = """
Binding-source contradiction (IMP-017).

- DEC-043 choice: "git joins the room's base tools"; docs/contract-target.md's room tools row says git is on the base PATH.
- design sec-6 (execution env row): call `session` by absolute path "(absolute: a non-login ssh command's `PATH` is not promised)".
- vm/session.nix prepends `tools/bin` to the *inherited* PATH and `exec`s by name, so `git` (and `bash`, `which`, design sec-3) is reached through exactly the PATH sec-6 says nobody promises.
- Live (phase-07 A7): inside `session`, `git` is `/run/current-system/sw/bin/git` — it held because NixOS's sshd gives a non-login command the system profile. Nothing in oubliette pins it; satan's interface relies on it.

The two sources must end up saying one thing. Which one (promise the non-login PATH and pin it, or make `session` independent of it) is a design choice, not the auditor's."""
disposition = "design-wrong"
response = "The code is what the live rung proved; the defect is that two binding sources disagree about the promise behind it. Reconcile brief: design sec-6 (execution env row) and sec-3 (base tools) must say the same as DEC-043 and docs/contract-target.md's room tools row. The choice of which way — promise the non-login PATH and pin it, or make `session` independent of the caller's PATH — is the user's, asked at /reconcile; the code half of the second option is IMP-017's (open, follow-up outside this slice). Until the user chooses, nothing is silently picked."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "design-wrong"
response = "The code is what the live rung proved; the defect is that two binding sources disagree about the promise behind it. Reconcile brief: design sec-6 (execution env row) and sec-3 (base tools) must say the same as DEC-043 and docs/contract-target.md's room tools row. The choice of which way — promise the non-login PATH and pin it, or make `session` independent of the caller's PATH — is the user's, asked at /reconcile; the code half of the second option is IMP-017's (open, follow-up outside this slice). Until the user chooses, nothing is silently picked."

[[finding.turn]]
