[[finding]]
id = "F-8"
status = "verified"
severity = "minor"
title = "Expected sec-5 to say what makes the room's state directory; observed the parent rule ISS-024 needed is not in the design, and the fix is evaluated, not yet live"
detail = """
design sec-5: "the directory made by the module's tmpfiles (`0700 owner users`)". Live (phase-07 U1), it was not: no rule declared `${stateDir}/room`, so tmpfiles made it root:root and refused the unsafe transition from the david-owned stateDir, while the switch reported success (ISS-024; mem.fact.oubliette.tmpfiles-needs-every-parent-declared). The live directory was hand-fixed (chown david:users, 0750).

4c1d210 adds `d ${rooms.stateRootOf …} 0750` (and `slotRoot` for the same latent slot gap) and an `unparented` check in hostModuleUnits. `just` is green at HEAD, so the module now declares every parent. What the evidence covers (STD-001): the declaration, at eval. What it does not: tmpfiles accepting it on this host, which waits on the user's next rebuild. ISS-024 is already `resolved · fixed`. sec-5 and sec-11 do not mention `stateRootOf` or the parent rule."""
disposition = "design-wrong"
response = "The code fix is right and pinned at eval (`unparented` in hostModuleUnits, green). Two parts. Design: reconcile brief — sec-5 names `stateRootOf`'s `0750` parent rule beside the room's `0700` directory, with ISS-024 as why; sec-11's `host/services.nix` and `mkfleet.nix` rows gain the parent rule and the `unparented` check. Live acceptance: tolerated rather than a blocker — the cause (an undeclared parent) is what the eval check pins, the declared-parent shape is the one every slot directory already runs under on this host, and the live directory already matches the rule by hand (david:users 0750). Reconcile adds to ISS-024 that tmpfiles' acceptance on this host is unobserved until the user's next rebuild."

