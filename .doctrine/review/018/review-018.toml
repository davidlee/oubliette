act = "dispose"
role = "responder"
disposition = "design-wrong"
response = '''Each departure is a tightening that keeps the design's own rules (2 before the door, argv only); the code is right. Reconcile brief: design sec-4 — `profileLoad` behind `refuseToken 2` in place of `select`, with why; step 1's full refusal list (`--user` login name, odd state root, both ref-format checks, `refs/heads/<branch>` exactly, `--` ends options); step 3/4's stdout lines, push `<oid>`, collect `<oid>\t<ref>`. Design sec-6's `GitChannel.refresh`/`collect` rows state those two stdout shapes, since satan parses them.'''

