title = "the drvPath manifest does not cover the host module"
detail = "GPT #4: package drvPaths miss unit definitions, tmpfiles, sudo rules and activation; the policyDir change alters module output (host/services.nix:469). The real ~/flakes toplevel is a separate rung."
disposition = "fix-now"
response = "Design revised (§Verification): the manifest adds the toplevel of a probe NixOS system importing nixosModules.capsule-perimeter; policyDir equal while real values are bound, explained change at cutover; real ~/flakes toplevel named as the user's separate rung."

