disposition = "fix-now"
response = "Design revised (§Recipes): import? so a fresh checkout parses, a tracked note recipe, shellHook re-points on every entry, nix-direnv reloads on flake.lock."

[[finding]]
id = "F-7"
status = "answered"
severity = "minor"
title = "an inherited CAPSULE_ROOT can aim the consumer devshell at the old checkout"
detail = "GPT #7, verified: perimeter/root.nix:6 prefers CAPSULE_ROOT then MICROVM_SPIKE_ROOT over $PWD; oubliette's .envrc exports CAPSULE_ROOT=$PWD. direnv unloads it on leaving, so the risk is a non-direnv shell or a consumer without its own .envrc."
disposition = "fix-now"
response = "Design revised (§Recipes): the template's .envrc exports CAPSULE_ROOT=$PWD like oubliette's, so an inherited root is replaced on entry."

