act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Design revised (§argument surface, §What moves where): the consumer's capsules declaration carries uplinkNet, both egress addresses and volumeReserve; names stay oubliette constants. DEC-026's 'only the lists' widens to lists plus addressing; reconcile annotates it."

[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "setup reaches the guest by its own import"
detail = "GPT #2, verified: vm/capsule.nix:59 imports ../setup.nix for the reset-home scrub list, host/programs.nix:348 for injection. The design must thread one setup value to both, or the guest scrubs a different list from the one injected."
disposition = "fix-now"
response = "Design revised (§argument surface): one setup value reaches both vm/capsule.nix:59 (specialArgs) and host/programs.nix:348; resetHomeCases keeps pinning the scrub list."

