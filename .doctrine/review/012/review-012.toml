response = "Design revised (§argument surface): one setup value reaches both vm/capsule.nix:59 (specialArgs) and host/programs.nix:348; resetHomeCases keeps pinning the scrub list."

[[finding]]
id = "F-3"
status = "answered"
severity = "blocker"
title = "self references cannot move into mkFleet"
detail = "GPT #3, verified: flake.nix:651 (hostModule evaluates self.nixosModules.capsule-perimeter) and :1473 (default = self.packages.${system}.capsule). Inside a builder called by a consumer, oubliette's self names the fixture's outputs."
disposition = "fix-now"
response = "Design revised (§Shape): flake.nix:651 and :1473 become references to the call's own bindings."

