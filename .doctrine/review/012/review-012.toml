[[finding]]
id = "F-8"
status = "answered"
severity = "major"
title = "templateCases skips the template's actual flake wiring"
detail = "GPT #8: design §Probes evaluates the template's declaration files, not templates/fleet/flake.nix, so a miswired input there passes."
disposition = "fix-now"
response = "Design revised (§Probes): templateCases calls the template's actual flake.nix outputs with stub inputs, so its wiring is tested; its inputs are never fetched."

