[[finding]]
id = "F-6"
status = "answered"
severity = "major"
title = "the consumer justfile cannot parse before its symlink exists"
detail = "GPT #6: .oubliette is created only by the devshell shellHook, so just --list/check fail on a fresh checkout, and a stale link parses another revision's recipes."
disposition = "fix-now"
response = "Design revised (§Recipes): import? so a fresh checkout parses, a tracked note recipe, shellHook re-points on every entry, nix-direnv reloads on flake.lock."

