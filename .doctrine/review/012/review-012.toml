[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "capsules.nix machinery still holds this host's addressing"
detail = "GPT adversarial review #1, verified: capsules.nix:158 uplinkNet 10.100.0.0/16, :182 volumeReserve, :288-295 the egress aggregator's names and 10.101.0.x addresses (the resolver-stub address ~/flakes must answer on). Splitting capsules.nix as a function of declared alone (design §What moves where) leaves host addressing in reusable code (POL-002/POL-003)."
disposition = "fix-now"
response = "Design revised (§argument surface, §What moves where): the consumer's capsules declaration carries uplinkNet, both egress addresses and volumeReserve; names stay oubliette constants. DEC-026's 'only the lists' widens to lists plus addressing; reconcile annotates it."

