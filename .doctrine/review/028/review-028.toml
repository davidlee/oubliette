[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Expected a slot can return to 'as declared' (record null, design sec-4 :409, sec-7 :655); observed no verb ever clears the override"
detail = '''
Design sec-4 reads `model_door` null as "as declared" and sec-7 has contract-assignment.md say the field is "written only by the verb, null meaning as declared". The verb writes only "on" / "off" and the override file `on\n` / `off\n`; no path removes the file or writes null. Once a slot has been toggled, its `capsules.nix` declaration no longer governs its door. Live, PHASE-08 leg 9: the "no override" precondition was reachable only by deleting /var/lib/capsule-model-door/a by hand, after which status (record "on") and the relay's condition (declared "off", no file) disagreed. Evidence: docs/probes.md "A model door on one slot, live"; ISS-030.
'''
disposition = "design-wrong"
response = """
The design never planned a way back: null is only the state before the verb is first used. Reconcile writes that into design.md sec-4 (beside :409) and into the contract row (docs/contract-assignment.md's `model_door`, sec-7 :655): once the verb has run, the override governs, and only deleting the file by hand returns a slot to its declaration. The verb that clears an override is new scope with its own lock, hook and undo rows, so ISS-030 owns it. Reconciliation Brief: per-slice design.md sec-4/sec-7.
"""

