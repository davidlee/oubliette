id    = 22
slug  = "design-review-of-sl-008"
title = "design review of SL-008"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = "Pass conducted on RV-023, a second ledger the agent opened by mistake for the same design review (gpt-6-sol adversarial and verification passes, eight findings, all disposed, five verified). RV-022 is the run's own ledger; its pass is RV-023's."

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-008"

# Findings are append-only `[[finding]]` tables, added by `review raise`.
# Empty here at creation — a fresh review is Active, awaiting the raiser.
