[[finding]]
id = "F-4"
status = "answered"
severity = "major"
title = "sec-7: room start cannot reuse the slot start path"
detail = "Slot start waits on ssh as hardcoded agent (host/cli.nix:748) then injects (1858+). A lounge room declares ada and bob, so it would read as failed."
disposition = "tolerated"
response = "The fixture is never booted live; its slots' readiness fails the same way (agent is authorized by the same empty adminKeys). On a live host root holds access.adminKeys by vm/door.nix, and the host holds no declared user's private key, so root is the only login the host can test. sshd answering root proves the door process is up; a declared user's login is the client's concern and is checked by live step 2."

