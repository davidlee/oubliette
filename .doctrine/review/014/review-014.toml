[[finding]]
id = "F-3"
status = "answered"
severity = "major"
title = "sec-3/4: a room guest can initiate traffic to its namespace's tap address"
detail = "The tap guard rule drops only daddr != tap_addr (host/netns.nix:217-224), and addr assigns net.host (227-235). sec-6/sec-9 say no host reachability; a TCP-only live check could miss ICMP or a future listener."
disposition = "tolerated"
response = "Deliberate. net.host is the room namespace's own end of the tap, not this host's root namespace; the namespace has no other link and nothing listens there, so guest-initiated traffic reaches no service. Plan F's model door (a future slice) is a listener at exactly net.host, so a drop here would be added now and removed then. If a room ever gains a listener at net.host, that slice owns its rule. User's call at review disposition."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Claim corrected, no new rule. net.host is the room namespace's own end of the tap; nothing listens there; ICMP is answered by that namespace's kernel. sec-6 egress row and sec-9 live step 3 now say exactly that. A drop of guest-initiated traffic to net.host would have to be undone by Plan F's model door, which listens there."

[[finding.turn]]
act = "contest"
