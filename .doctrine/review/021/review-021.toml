[[finding]]
id = "F-3"
status = "answered"
severity = "minor"
title = "The survey's export-only cost omits malebolge's missing development dependency tree"
detail = "Expected: the evidence for 'cost ... exporting what exists, plus a recipe per repo' (RFC-001 lines 235-242) covers the motivating commands, including malebolge just check (lines 20-22). Observed: /home/david/dev/malebolge/flake.nix:43-48 explicitly runs npm prune --omit=dev before copying its runner node_modules; lines 58-60 exports dev-tools from a tool list containing node and just, not its npm development tools. Its justfile:2-15 runs biome, eslint, tsc and vitest, all listed as devDependencies in package.json. The RFC acknowledges 'production dependencies only' but still treats this as an export-only adoption. Exporting the existing final runner tree cannot satisfy those commands. Verified by source inspection, not by a build or live command. Repair: qualify the survey as reusable packaging machinery rather than a complete existing tree, and require a full development-dependency output for malebolge with the actual just check path as the acceptance command. This does not overturn choosing A; it corrects the evidence and scope used to justify its cost."
disposition = "fix-now"
response = "Correct: the cost estimate overclaimed. Malebolge's tree prunes the development dependencies just check runs, so exporting it fixes nothing. The mechanism exists; the artefact does not. Integrated: RFC-001's Outcome and POL-005's Rationale now say the mechanism exists in all three repos, and malebolge needs a second output, a complete development tree. malebolge IMP-001 already asked for that tree and now names its acceptance: just check passes in a sealed room, from a clean checkout and over an existing tree. Source inspection only."

