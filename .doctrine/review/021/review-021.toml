[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "The accepted drift guard checks the lockfile but misses changed dependency manifests"
detail = "Expected: option A's refusal prevents a room's mutable checkout from silently using dependencies built for a different dependency specification. Observed: RFC-001 lines 251-252 specifies only embedding/comparing the lockfile hash. A room user can edit package.json to add/change a dependency while leaving bun.lock/package-lock.json untouched, a normal intermediate state of development. The proposed check still succeeds against the old exported tree. Because POL-005 forbids the install that would otherwise reconcile or reject that state, the recipe can use stale dependencies or report missing tools instead of the promised drift refusal. This is a design deduction from the specified equality predicate; no new guard exists here to execute. Repair: define a per-repo fingerprint over all dependency-defining inputs, at least manifests and lockfiles, plus workspace manifests, patches/configuration where relevant. Bind that fingerprint to the exported tree and check it before every consuming recipe. Add a negative verification case where only package.json changes. Keep this repo agnostic by making the producer and verifier the consuming repo's responsibility."
disposition = "fix-now"
response = "Correct: a lockfile-only hash misses a manifest edit made without relocking, and POL-005 removes the install that would otherwise catch it. Integrated: RFC-001's Outcome drift guard is now a repo-owned fingerprint over every input that determines the tree (manifests, lockfiles, workspace manifests, patches, package-manager config), bound into the output and checked before use, with the manifest-only change as the negative case to verify. The same class was swept in E's staleness record (item 4, open question 8), POL-005's statement, docs/contract-target.md's dependencies row, doctrine IMP-519 item 3 and malebolge IMP-001 item 4. Oubliette learns no package-manager detail. No guard implemented or run."

