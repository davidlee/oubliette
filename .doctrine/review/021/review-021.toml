[[review.turn]]
act = "conclude"
role = "raiser"
note = "Reviewed RFC-001 and POL-005 against room/session source and the three surveyed repos. Raised three source-backed findings: the deferred E scratch-volume return channel, the accepted lockfile-only drift guard, and the incomplete malebolge development-tree evidence. No builds, evaluations, installs or live guest probes; security and drift failure scenarios are deductions, not executed demonstrations. This concludes the reviewer pass; findings are left for responder disposition rather than treated as repaired or accepted."

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "RFC-001"

[[finding]]
id = "F-1"
status = "answered"
severity = "major"
title = "E needs a fresh host-controlled transfer boundary; its shared scratch disk carries room data into egress"
detail = "Expected: the deferred escape hatch preserves P1 even after arbitrary code has run in the sealed room. Observed: RFC-001 lines 163-188 attaches the same /setup scratch volume in room mode and later in the networked setup boot, but calls its contents public packages/manifests and says a fetcher exploit finds nothing to take. Nothing requires that volume to be read-only in room mode, discarded before setup, or replaced from host-controlled inputs. Room code can stage private repo/home data there; a later compromised fetcher (expressly within E's residual-risk model), including guest root, can read and transmit it. Detaching /home and /work does not eliminate this persistent channel. This is a verified omission in the design; the exploit scenario is inferred, not executed. Repair: make each networked setup use fresh scratch with no room-writable predecessor, transfer outputs only after egress is gone, and recreate/discard that scratch before any subsequent networked boot. If caching is retained, specify how room-written blocks can never reenter a networked guest, including failed runs/retries. Amend E's safety claims before treating it as POL-005's safe fallback. E is deferred, so this is major rather than a current-policy blocker."
disposition = "fix-now"
response = "Correct: E's step 3 attached /setup in room mode and then reattached it to the next setup boot, so a room-written block could reach a guest with egress. The claim that a fetcher exploit finds nothing to take was false. Integrated in RFC-001 E: every setup boot gets a fresh, host-created scratch volume. The result goes one way, into the room, read-only at the drive. The host discards the image before the next networked boot. A cache retained across setups is excluded unless separately argued, including retry and failure paths. The residual-risk paragraph and the P2 row are corrected, and POL-005's escape-hatch description now names the fresh scratch. E remains deferred; today's sealed-room policy is unaffected. Not exercised."

