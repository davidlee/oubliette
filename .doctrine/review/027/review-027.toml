Criterion (sec-6, modelDoorOpenCases): the three NUL rows join the fixtures; added mutations are command-substitution comparison (caught by o\0n\n) and the dropped trailing exit (caught by on\n over declared off). Not exercised: systemd's handling of the status.
'''

[[finding.turn]]
act = "verify"
role = "raiser"
note = '''
VERIFIED at design/snippet scope. The revised literal condition in design.md:238-241 uses printf 'on\n' | cmp -s -- - "$2" followed by exit; file bytes no longer pass through a Bash variable. Sec-4:244-251 explicitly supplies diffutils in runtimeInputs and explains the exit boundary. Sec-6:601-611 adds the three NUL-bearing rows and concrete command-substitution/dropped-exit mutations.

Independently extracted the current condition directly from materialised design.md and ran bash -euo pipefail against readable fixtures delivered through inherited pipes at /dev/fd/<fd>, with no filesystem writes. All 26 matrix verdicts matched: for each declared on/off, canonical on+LF alone returned 0; off+LF, x+LF, on without LF, both multiline permutations, extra LF, embedded/trailing/leading NUL and empty returned 1; absent override followed the declaration; an existing directory causing a cmp read error returned 2. The directory is a read-error control, not a permission-denial reproduction.

Re-ran the original o,NUL,n,LF counterexample against the prior sentinel/command-substitution condition (0 with Bash's ignored-null warning) and the revised comparator (1). The named mutation using command substitution returned 0 for that malformed payload, while removing the trailing exit returned 1 for canonical on+LF over declared off instead of the required 0. Thus the specified rows discriminate both named faults. This verifies the repair's shell semantics and test design; it does not run the future shipped modelDoorOpenCases suite, prove dependency wiring, exercise systemd's status handling, or open a live relay. No new defect established.'''

