note = "VERIFIED at the design-repair scope requested for this follow-up, against 51de6e0 and current source. Revised design.md:242-248,269-282,315-328 resolves the effective value while holding the same per-slot record lock used by the model verb, releases it before requesting the VM, and makes off stop the relay regardless of VM state. Rechecking the original schedules: off before the locked start render makes start read the committed off; off after that render overwrites the bit before any later activation reads it; off after the relay passed ExecCondition stops/cancels that activation. The old not-active-VMM escape no longer applies. Compared with the real lock/commit boundary in host/record.nix:93-146 and lifecycle in host/cli.nix:2070-2151. This accepts the revised protocol, not implemented/running code: the probe/control execution remains future work, and F-4 separately contests whether the promised start-composition cases can be reached. The newly exposed repeated-start/default-change case is distinct and will be raised separately."

[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "The record hook can open the relay before a record commit that subsequently fails"
detail = """
Expected: the record, rendered bit and unit transition either agree on the new selection or the failed command leaves a safe, accurately reported state (sec-4:270-279; sec-6:418-420).

Observed: the design restores the previous bit only when systemctl fails (.doctrine/slice/010/design.md:272-277), and its sole record.nix change is the skeleton field (:294-295, :523). But the actual recordWrite calls recordAlso first (host/record.nix:99-102), before even reading/transforming the current record (:103-105), writing the candidate (:131-142), or renaming it (:144). A successful hook has no compensation callback if any later step fails.

Failure scenario (source-backed inference; not fault-injected here): the old record says off; model on writes on and successfully starts the relay; writing the larger assignment candidate fails with ENOSPC, or the final mv fails. recordWrite returns failure while the old off record survives and the render/relay remain on. The designed undo path is never reached. A malformed existing record exposes the same ordering problem before candidate serialization. Holding flock does not make these external effects transactional.

Repair: specify failure handling across the complete record commit, not just the systemctl call. Prepare and validate the candidate before applying external effects, and define compensation or recoverable reconciliation for a failed final commit, including how to fail closed and report any unsuccessful compensation. Include post-hook write/rename failures in the transition cases. The inherited policy hook's similar exposure is evidence about the mechanism; this raise is against SL-010's new reliance on it."""
disposition = "fix-now"
route = "probe"
response = """
Verified. host/record.nix runs recordAlso (line 99-102) before reading the current record, transforming it and moving it into place (103-144), so a hook that succeeded is never compensated when a later step fails. The policy hook has the same exposure today.

Design change (sec-4, and host/record.nix in sec-9): recordWrite computes and writes the candidate first, then runs the hook, then moves the candidate into place. Only the final mv can fail after the hook. For that one step, an optional recordUndo hook is called when the mv fails after recordAlso succeeded; the model verb's undo restores the previous bit and stops the relay, which is fail-closed whichever way the selection went. A failed undo is reported and exits non-zero naming the slot. The policy verb gets the same ordering for free and may declare an undo later; that is noted, not done here.

Probe. Must hold against: any step of the record commit failing after the hook succeeded (an unreadable or malformed current record, a failed candidate write, a failed mv). Need not hold against: the host losing power mid-commit.

Criterion: cases that make the candidate write fail (unwritable record directory) and the mv fail, and assert that a failed on leaves the bit and the relay as they were, and a failed off leaves the relay stopped. Host phase constraint: lands with or after the record.nix reordering.
"""

