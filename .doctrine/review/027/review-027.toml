[[finding]]
id = "F-5"
status = "answered"
severity = "minor"
title = "The pi environment example does not export its offline controls"
detail = """
Expected: the child pi process receives PI_OFFLINE, PI_SKIP_VERSION_CHECK and PI_TELEMETRY from the consumer's .env payload (DEC-073; sec-5).

Observed: .doctrine/slice/010/design.md:329,346-347 tells the consumer to add plain assignments to .env. The guest sources that file with an ordinary dot command (vm/capsule.nix:294-297), without set -a; plain shell assignments do not export previously unexported variables. The existing guest example explicitly uses export for the same reason (vm/capsule.nix:313-314).

Reproduced without writing files: env -u PI_OFFLINE -u PI_SKIP_VERSION_CHECK -u PI_TELEMETRY bash --noprofile --norc -c '<the three assignments>; bash --noprofile --norc -c <print child variables>' printed child: PI_OFFLINE=unset PI_SKIP_VERSION_CHECK=unset PI_TELEMETRY=unset. Thus source-level documentation that pi supports these variables does not prove this delivery example supplies them. The inference is that a fresh interactive launch retains pi's default automatic-network behavior.

Repair: show explicit export assignments in the payload and verify the environment at the actual pi launch boundary, including the intended worker/noninteractive path if that is the consumer. The rotation/write-if-absent correction in F-3 also applies when updating an already-injected .env."""
disposition = "fix-now"
response = """
Verified: vm/capsule.nix 294-297 sources .env with a plain dot, and its own MOTD example uses export. The raiser's reproduction stands. sec-5 shows export for all three lines and states the boundary: .env is read by interactive login shells only (programs.bash.interactiveShellInit), so a non-interactive launcher, such as a quotient worker started over ssh, must source it or set the variables itself. The live run checks the variables at pi's actual launch.
"""

