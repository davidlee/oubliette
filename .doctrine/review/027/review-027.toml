[[finding]]
id = "F-6"
status = "answered"
severity = "minor"
title = "The accepted port range includes ports the capability-free owner cannot bind"
detail = """
Expected: accepted modelDoor endpoints are usable with the designed owner/hardening model, or evaluation clearly refuses the unsupported range.

Observed: .doctrine/slice/010/design.md:84-89 accepts every integer port in 1-65535 except 22 and proxyPort. The relay runs as cfg.owner (:141) and inherits empty CapabilityBoundingSet and AmbientCapabilities from host/services.nix:360-366. Unlike the ssh relay, whose TCP leg connects outward, this unit must bind a TCP listener. host/netns.nix configures forwarding/addressing but never lowers ip_unprivileged_port_start (repository search found no such setting).

The kernel documents that this threshold is per network namespace, defaults to 1024, and ports below it require root or CAP_NET_BIND_SERVICE: https://docs.kernel.org/networking/ip-sysctl.html#ip-variables . Therefore a perfectly accepted declaration such as port=443 fails bind on the default namespace configuration. This is an inference from the specified unit and documented kernel defaults, not a privileged-port runtime probe or a claim about every host's custom sysctls.

Repair: make the supported port contract agree with the capability-free service: conventionally refuse ports below 1024 and pin that reason with a negative case, or explicitly design and verify the required privilege/sysctl mechanism. Do not rely on an undeclared host sysctl."""
disposition = "fix-now"
response = """
Verified: the relay inherits an empty capability bounding set and nothing lowers ip_unprivileged_port_start (no such setting in the tree). model-door.nix refuses ports below 1024, replacing the 1-65535 range check, with a negative case for 443.
"""

