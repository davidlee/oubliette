[[finding]]
id = "F-3"
status = "answered"
severity = "major"
title = "Normal restarts preserve injected keys and pi configuration instead of refreshing them"
detail = """
Expected: the consumer-owned inject design must state the real credential/configuration refresh lifecycle; sec-5 promises that a revoked or reissued key arrives on the next start without --force (.doctrine/slice/010/design.md:318-321).

Verified source contradiction: vm/capsule.nix:44-46 places HOME on the persistent volume and explicitly says it survives reboots. Lines 51-72 construct the separately host-invoked reset-home program; they do not arrange a reset at boot. The boot seed only creates/chowns HOME (:254-272), and the MOTD repeats its persistence (:306). The real front-end start waits for SSH and invokes inject (host/cli.nix:2137-2151); inject skips an existing destination unless --force (host/inject.nix:127-135). The research row marked verified (.doctrine/slice/010/research/research.md:146-150) confused inclusion in an explicit scrub with execution of that scrub on every start.

Consequences, inferred from those shipped branches: after key K1 has been injected, changing the host producer to K2 and stopping/starting the VM retains K1. Revoking K1 therefore leaves pi failing authentication, and replacing models.json or adding offline settings is also skipped. The request-time !cat reads the stale guest file. Existing settings.json/packages may persist too, so sec-5:357 cannot establish their absence merely by not injecting a settings.json.

Repair while retaining DEC-073's consumer ownership and unchanged guest code: document and exercise explicit per-payload --force rotation/config refresh, or design an explicit generic refresh mechanism if automatic next-start replacement is required. Do not implicitly erase HOME on every boot. Correct the evidentiary premise in design/research and add a two-start, changed-payload criterion that distinguishes preservation from replacement."""
disposition = "design-wrong"
route = "refresh"
response = """
Verified, and it defeats a claim I made. vm/capsule.nix 44-46 puts HOME on the volume and says it survives reboots; the reset is the host's volume reset-home verb over the admin door (vm/capsule.nix 51-72, host/cli.nix 202-211), not a step of every start; inject skips an existing dest without --force (host/inject.nix 127-135). Research row 4 in Thread 2 was marked verified and conflated scrub membership with scrub execution.

Refresh. The code is right; the records are wrong. Edits: design sec-5 states the real lifecycle (a payload lands once, at the first start after the volume is new or HOME is reset; a re-issued key or a changed models.json reaches the guest by capsule-inject with --force for that payload; a repurpose's volume reset-home removes both). sec-6's live sequence gains a two-start, changed-payload leg that tells preservation from replacement. research.md's row is corrected in place with a note. Records citing the false premise, swept: DEC-073's rationale (a HOME dest is reset and re-injected every start) and the slice notes. DEC-073's choice is unaffected; its rationale is corrected, and the user is told.
"""

