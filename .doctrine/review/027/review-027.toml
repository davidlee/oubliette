[[finding]]
id = "F-8"
status = "answered"
severity = "minor"
title = "The live denial leg cannot verify the claimed guest-only listener restriction"
detail = """
Expected: evidence for the DEC-070 guest-only listener distinguishes enforcement of IPAddressAllow/IPAddressDeny from an unreachable or empty endpoint (ADR-003, STD-001).

Observed: .doctrine/slice/010/design.md:175-178 makes the per-unit IP filter the control that bounds who reaches the listener. But hostModuleUnits only asserts the configured fields (:388-389), and the live negative leg tries another host port (:436-438). host/netns.nix:259-262 accepts tap traffic to any port on net.host; a refusal at an unoccupied other port is the kernel reporting no listener, not evidence of this unit's source restriction. Removing both IPAddress directives could leave every planned live step green. systemd additionally documents that these IP filters have no effect where the needed eBPF support is unavailable: https://www.freedesktop.org/software/systemd/man/latest/systemd.resource-control.html#IPAddressAllow= . This review has not established that support is absent on this host.

Repair: retain the positive request from the guest, and add a negative request to the SAME listening door with a non-guest source and otherwise valid gateway authentication, e.g. from the slot namespace's host address. Establish that the negative source/path is viable, so routing failure cannot masquerade as filtering. Define how unsupported filtering is detected/refused if guest-only admission is a product guarantee. The existing another-port check can remain as a separate observation, with its narrower evidentiary meaning."""
disposition = "fix-now"
response = """
Accepted: a refusal on another port shows no listener there, not that the source filter works. sec-6's live sequence gains a leg against the same door from a non-guest source: from the slot namespace itself (source net.host) the door must refuse, with a positive control that a throwaway listener on net.host at another port in the same namespace accepts the same client, so the path is viable and the refusal is the filter. The another-port leg stays with its narrower meaning. If IP filtering is unsupported on the host, the negative leg goes red, which is the detection; the module does not try to detect eBPF support.
"""

