[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "A completed model off can be overwritten by a concurrent start"
detail = """
Expected: after an owner successfully selects off, a concurrent front-end start must not leave a running model relay over a record that says off (DEC-069/DEC-072; sec-4 explicitly calls that fail-open).

Observed: .doctrine/slice/010/design.md:235-239 adds a second writer of the rendered bit, at start, but only the model verb's hook participates in the record lock (:270-278). The existing start path holds only the shared volume lock (host/cli.nix:2078-2092), then starts the VM (:2117-2119); no shared start/model enforcement protocol is designed. The hook treats every not-active VM as safe to leave alone, even though a start can be pending.

Counterexample, inferred from the specified algorithm, not a live reproduction: start resolves the old effective on; model off obtains the record lock, writes off, sees an inactive VM, commits off and returns success; start then writes its previously resolved on and starts the VM. ExecCondition reads on, so the door opens while the record remains off. A small in-memory schedule of these exact abstract steps reached {record: off, render: on, vm: active, relay: running}; this demonstrates the algorithmic interleaving only. Even locking the render alone is insufficient: relay activation may already have passed ExecCondition while the VMM is still activating, and the off hook then skips the stop. Sec-3 orders the relay against netns/tap, not against an active VMM (:136-139, :188-196).

Repair: define one serialization/reconciliation protocol for start and model changes, including pending/activating VM and relay jobs; resolve the record inside that protocol, publish the bit atomically, and ensure a completed off cannot be followed by an older start decision. Merely adding a lock around the file write does not establish that invariant. Add deterministic cases for both interleavings and their reverse directions. This finding concerns ordinary authorized front-end commands, not the separately disclosed bare-systemctl stale-render residual."""
disposition = "fix-now"
route = "probe"
response = """
Verified. The start verb (host/cli.nix 2070-2151) takes only the shared volume lock, and the design's hook decided on the VM's state, so both interleavings the raiser describes are reachable as specified. Accepted at the raiser's severity.

Design change (sec-4): the protocol becomes three rules. (1) The start-time render runs under the slot's record lock, before the VM start is asked for, and the lock is released before the start; the render is the same function the verb's hook uses. (2) off always writes the bit and then always stops the relay, whatever the VM is doing; stopping an inactive unit is a no-op and stopping an activating one cancels it, so an off never depends on reading the VM's state. (3) on writes the bit and starts the relay only when the VM is active; an on that races a VM start can end with the relay skipped (fail-closed), never open, and re-running the verb repairs it. Last writer under the lock wins the bit, and the only writer that can open the relay is an on, which is also the last record write.

Probe. Must hold against: two front-end commands by the owner on one slot, start and model off or model on, in either order and overlapping at any step, including a relay already past its ExecCondition while the VMM is activating. Need not hold against: a bare systemctl start microvm@ (ISS-029), root editing the state file, or a second host.

Criterion: deterministic cases in the front-end suite, through the injected unit-control seam (F-4), that drive each interleaving by pausing one command at its lock boundary, and assert the end state never has record off with relay running. Host phase constraint: needs the unit-control seam and the shared render function to exist first.
"""

