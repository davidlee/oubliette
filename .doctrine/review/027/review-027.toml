[[finding.turn]]
act = "verify"
role = "raiser"
note = "VERIFIED as a design repair, not implementation proof. Compared the actual recordWrite order (host/record.nix:99-105,131-145) with revised design.md:318-341 and code-impact :651. The revision prepares/transforms/writes the candidate before recordAlso, then supplies an explicit recordUndo for a failed final rename. For the original old-record-off -> requested-on -> rename-failure scenario, undo restores the old off/absent bit and stops the relay. It also explicitly reports failed compensation as unknown rather than claiming nothing moved. The acknowledged absence of policy-verb undo is outside the new model-door contract; preparing its candidate first narrows the existing exposure without pretending to close it. The proposed record implementation and fault-injection cases do not exist yet and were not run. F-4's test-plan contest includes the need to distinguish no-effects candidate failures from post-hook rename failures and to state fail-closed versus exact-restoration expectations consistently."

[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "Normal restarts preserve injected keys and pi configuration instead of refreshing them"
detail = """
Expected: the consumer-owned inject design must state the real credential/configuration refresh lifecycle; sec-5 promises that a revoked or reissued key arrives on the next start without --force (.doctrine/slice/010/design.md:318-321).

Verified source contradiction: vm/capsule.nix:44-46 places HOME on the persistent volume and explicitly says it survives reboots. Lines 51-72 construct the separately host-invoked reset-home program; they do not arrange a reset at boot. The boot seed only creates/chowns HOME (:254-272), and the MOTD repeats its persistence (:306). The real front-end start waits for SSH and invokes inject (host/cli.nix:2137-2151); inject skips an existing destination unless --force (host/inject.nix:127-135). The research row marked verified (.doctrine/slice/010/research/research.md:146-150) confused inclusion in an explicit scrub with execution of that scrub on every start.

Consequences, inferred from those shipped branches: after key K1 has been injected, changing the host producer to K2 and stopping/starting the VM retains K1. Revoking K1 therefore leaves pi failing authentication, and replacing models.json or adding offline settings is also skipped. The request-time !cat reads the stale guest file. Existing settings.json/packages may persist too, so sec-5:357 cannot establish their absence merely by not injecting a settings.json.

Repair while retaining DEC-073's consumer ownership and unchanged guest code: document and exercise explicit per-payload --force rotation/config refresh, or design an explicit generic refresh mechanism if automatic next-start replacement is required. Do not implicitly erase HOME on every boot. Correct the evidentiary premise in design/research and add a two-start, changed-payload criterion that distinguishes preservation from replacement."""
disposition = "design-wrong"
route = "refresh"
response = """
Contest accepted; verified at host/cli.nix 2483-2484 (a repurpose is not a reset), 2244-2266 (reset-home calls guestResetHome without the scrub flag and re-injects at once), vm/reset-home.nix 85-89 (the scrub paths, .env among them, go only under the scrub flag), host/cli.nix 787-806 (the scrub runs only on a clone marker), and host/guest-ssh.nix 90-115 (bare capsule-inject needs a name).

Refresh, second sweep. sec-5 now carries a table by event: start, re-assignment by setup, volume reset-home, a clone's first inject, and inject with force, each split into the payloads under HOME and .env outside it, with the citations above. Refresh commands are written as capsule n inject name --force, which names the slot through the front end. The live legs use the same form. DEC-073's rationale is corrected again to say HOME persists across starts and re-assignments, and is replaced by reset-home (which re-injects at once), a clone scrub, or a forced inject. The research row says only what the code does and needs no further change. The slot-owned key decision is unchanged: a re-assignment keeps HOME, so the key stays the slot's.
"""

