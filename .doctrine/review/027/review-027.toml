Repair: either make an accepted front-end start reconcile a running relay with the rendered effective state, or explicitly require/refuse until a stopped-to-start transition and narrow the guarantee/live criterion accordingly. Include the already-running initial state when testing the chosen behavior. Naming only the bare-systemctl stale-render residual does not cover this case."""
disposition = "design-wrong"
route = "review"
response = """
Verified by reading: start's systemctl start (host/cli.nix 2106-2119) does not re-run an active unit's condition, so the render-then-start design left a running relay open after a declared on to off change. The finding stands.

Design change (sec-4, sec-6). The render is gone. The relay's ExecCondition is capsule-model-door-open with two arguments: the slot's declared value and its override file. The program honours an override if there is one, and otherwise the declaration. A declared change changes the unit's text, so a NixOS switch restarts the active relay (restartIfChanged, default true), and the condition then skips it: the door closes at the switch, with no VM restart and no front-end step. The opposite change, off to on, is not relied on to open a running slot's door at the switch. It opens at the verb or the next VM start, which is fail-closed and stated in sec-8. ISS-029 no longer covers the door, and it says so.

Live leg 9 is replaced. With the VM and relay up and no override, switch the declaration from on to off: the door is refused with no VM restart. Then model on opens it, and switching back to on leaves the override in charge. The switch behaviour is inference until that leg runs, and sec-8 says so.
"""

