[[finding.turn]]
act = "verify"
role = "raiser"
note = "VERIFIED for the original line-search defect. Current design.md:238-247 compares the complete textual value with a trailing-newline sentinel; sec-6:596-603 names both original two-line cases, missing/extra newlines, empty input and the old grep mutation. I extracted the condition directly from the materialised design and ran it with bash -euo pipefail, passing readable fixtures over inherited pipes at /dev/fd/<fd> without filesystem writes, with each declared value. on+LF returned 0; off+LF, invalid+LF, on without LF, on+LF+off+LF, off+LF+on+LF, on+LF+LF and empty all returned 1. Absent override returned 0 only with declared on. An existing path whose cat fails (directory /dev/fd) returned 1 under both declarations; that is a read-error test, not a Unix permission-denial test. Re-running the old literal line-search condition admitted on+LF+off+LF while the replacement rejected it. The new NUL-stripping defect is a separate revision-exposed finding, raised on this pass; this verify does not certify arbitrary-byte validation. Only the specified shell snippet was run, not the shipped future suite, systemd or a network relay."

[[finding]]
id = "F-11"
status = "verified"
severity = "minor"
title = "The whole-file condition drops NUL bytes before validating an override"
detail = """
Revision-exposed defect in the F-10 repair. Expected: design.md:239-247 opens only for the exact bytes on+LF and rejects malformed overrides; sec-6:596-603 says only that override or absent+declared-on exits 0.

Observed, reproduced from the current literal condition (.doctrine/slice/010/design.md:238-242): c=$(cat -- "$2" && echo .) captures file content in a Bash variable. Bash strips NUL bytes during command substitution. With declared off and override bytes o, NUL, n, LF (hex 6f 00 6e 0a), the revised condition returns 0, with stderr 'warning: command substitution: ignored null byte in input'. The same payload returns 1 under the old grep -qx on condition. Thus this is a new acceptance introduced by the replacement, rather than the original multiline counterexample. Another malformed payload on, NUL, LF also returns 0 under the replacement (it was also accepted by the old line-search condition).

Reproduction: extracted the condition text directly from design.md; used Python os.pipe to pass those exact bytes as an inherited /dev/fd/<fd> argument to bash -euo pipefail -c <condition> probe off <fd-path>, with no filesystem writes. Positive on+LF returned 0; off+LF, invalid+LF, and the original on+LF+off+LF counterexample returned 1. This establishes snippet exit statuses, not actual unit/guest exposure. Inference: ExecCondition would admit the relay for that malformed override despite declared off.

Severity minor, consistent with F-10: the normal verb writes canonical values, and no guest write access or ordinary successful command producing NUL content is established. The defect is in the advertised malformed-state contract.

Repair: perform a byte-preserving comparison with canonical on+LF, or explicitly detect/reject NUL bytes before any lossy shell-variable conversion. Include the embedded-NUL counterexample with canonical on/off controls in modelDoorOpenCases, and require a mutation back to the current command-substitution comparison to fail that row. Do not infer byte equality from a Bash string comparison."""
disposition = "fix-now"
response = '''
Verified: $(…) drops NULs, so o\0n\n compared equal.

Design change (rev 33, sec-4): the condition no longer reads the override into a shell variable. It is `printf 'on\n' | cmp -s -- - "$2"; exit`, byte for byte, with diffutils in runtimeInputs. Run here under set -euo pipefail over none, on\n, off\n, x\n, on, on\noff\n, off\non\n, on\n\n, empty, o\0n\n, on\0\n, \0on\n and unreadable, each with declared on and off: exit 0 only for none+declared on and for on\n; unreadable exits 2, which ExecCondition treats as a skip like 1 (255 is the failure status). My first draft used `exec cmp` inside the pipeline, which falls through to the declared value because the pipeline's last command runs in a subshell; the trailing `exit` is load-bearing and sec-4 says so.

Criterion (sec-6, modelDoorOpenCases): the three NUL rows join the fixtures; added mutations are command-substitution comparison (caught by o\0n\n) and the dropped trailing exit (caught by on\n over declared off). Not exercised: systemd's handling of the status.
'''

