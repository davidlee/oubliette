Refresh. The code is right; the records are wrong. Edits: design sec-5 states the real lifecycle (a payload lands once, at the first start after the volume is new or HOME is reset; a re-issued key or a changed models.json reaches the guest by capsule-inject with --force for that payload; a repurpose's volume reset-home removes both). sec-6's live sequence gains a two-start, changed-payload leg that tells preservation from replacement. research.md's row is corrected in place with a note. Records citing the false premise, swept: DEC-073's rationale (a HOME dest is reset and re-injected every start) and the slice notes. DEC-073's choice is unaffected; its rationale is corrected, and the user is told.
"""

