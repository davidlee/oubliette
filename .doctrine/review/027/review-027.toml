[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "design-wrong"
route = "review"
response = """
Verified by reading: start's systemctl start (host/cli.nix 2106-2119) does not re-run an active unit's condition, so the render-then-start design left a running relay open after a declared on to off change. The finding stands.

Design change (sec-4, sec-6). The render is gone. The relay's ExecCondition is capsule-model-door-open with two arguments: the slot's declared value and its override file. The program honours an override if there is one, and otherwise the declaration. A declared change changes the unit's text, so a NixOS switch restarts the active relay (restartIfChanged, default true), and the condition then skips it: the door closes at the switch, with no VM restart and no front-end step. The opposite change, off to on, is not relied on to open a running slot's door at the switch. It opens at the verb or the next VM start, which is fail-closed and stated in sec-8. ISS-029 no longer covers the door, and it says so.

Live leg 9 is replaced. With the VM and relay up and no override, switch the declaration from on to off: the door is refused with no VM restart. Then model on opens it, and switching back to on leaves the override in charge. The switch behaviour is inference until that leg runs, and sec-8 says so.
"""

[[finding.turn]]
act = "verify"
role = "raiser"
note = """
VERIFIED as a design repair, not switch/runtime proof. design.md:146 and sec-4:218-262 now put the declaration in ExecCondition's argument and leave only an override in the file; start no longer renders a default (:250-252,281-283). Thus on->off changes the active relay's unit definition, rather than writing a bit that an already-active unit never rereads. Sec-6:516-519 pins that differing argument at module evaluation, and live leg 9 (:607-611) now begins with VM and relay up/no override and tests closure at the switch without a VM restart or frontend start. Sec-8:661-665 explicitly bounds the off->on behavior and marks active-relay switch behavior inferred until exercised. This removes the counterexample involving host/cli.nix:2106-2119's ordinary systemctl start no-op. The relay's dependency/hardening model remains consistent with host/services.nix:342-384 and DEC-070/072; no dependency back from the VMM requiring its own restart is proposed (sec-3:143-144,195-202). ISS-029's show projection now explicitly excludes the door's new shape.

Restart premise cross-check: local NixOS reference source /nix/store/0c7qm6wkgdg9dd3ws34vvg9xacdwa0dq-source/nixos/lib/systemd-unit-options.nix:548-554 defaults restartIfChanged to true; /nix/store/0d3h8gi2q46fb4l563h6pginjw2a90r4-source/nixos/modules/system/activation/switch-to-configuration.pl:489-505,530-543 schedules changed services for restart or stop/start unless opted out. These are source references, not proof they are the consumer's precise deployed revision. Upstream's switch sequence likewise reloads definitions before restart/start: https://github.com/NixOS/nixpkgs/blob/master/nixos/doc/manual/development/what-happens-during-a-system-switch.chapter.md . Live leg 9 remains the required deployed-composition evidence (STD-001). No switch, VM restart, Nix evaluation or build was performed."""

[[finding]]
id = "F-10"
status = "verified"
severity = "minor"
title = "The new condition accepts malformed overrides containing an on line"
detail = '''
Expected: sec-4's override contract is one on/off value (design.md:229-239); an existing override holding anything but on skips the relay (:265-266), with malformed inputs covered by modelDoorOpenCases (:575-580).

Observed and reproduced: the new literal condition at .doctrine/slice/010/design.md:238 uses grep -qx on. This checks whether ANY entire line matches on, not whether the complete override contains only that value. I extracted the two condition lines directly from the current design, passed each fixture to bash over an inherited pipe exposed as /dev/fd/<fd> (no filesystem writes), and used declared=off. Results: override on\n -> exit 0; off\n -> exit 1; invalid\n -> exit 1; on\noff\n -> exit 0. Thus the malformed two-value override is admitted even though the declaration is off. GNU grep documents line matching and -q's any-match success: https://www.gnu.org/s/grep/manual/grep.html . This reproduces the specified condition's exit status only; actual systemd activation/door exposure is inferred, not run.

Consequence: a damaged/noncanonical override containing an on line can open a declared-off door at activation, contradicting the new fail-closed contract. Severity minor: the normal verb is specified to write a canonical single value, and this review has not established that an ordinary successful verb produces such malformed content or that the guest can edit the host file.

Repair: validate the complete override as a single allowed value and close on all other content/read errors. Add the explicit on-plus-extra-line counterexample (including on followed by off) to the shipped-text condition suite; a plain invalid-token fixture alone would pass with the current bug. Keep valid on, valid off and absent-override controls.'''
disposition = "fix-now"
response = '''
Verified and reproduced independently: grep -qx on admits on\noff\n.

Design change (rev 29, sec-4): the condition compares the whole override with the verb's exact bytes: c=$(cat -- "$2" && echo .) || exit 1; [ "$c" = $'on\n.' ]; exit. The sentinel keeps trailing newlines, so on\n\n also closes; an unreadable file exits 1 (skip). Run here under set -euo pipefail over: none, on\n, off\n, x\n, on (no newline), on\noff\n, off\non\n, on\n\n, empty, unreadable, each with declared on and off. Only "none + declared on" and "on\n" exit 0. This exercised the two-branch text in bash, not systemd's use of the status.

Criterion (sec-6, modelDoorOpenCases): those fixtures are the rows, and a second mutation, the comparison weakened back to a line search (grep -qx on), must be caught by on\noff\n.
'''

