[[finding]]
id = "F-7"
status = "answered"
severity = "minor"
title = "Socket validation accepts endpoints hidden by the shared relay sandbox"
detail = """
Expected: the stated assumption that the owner can open the caller's Unix socket is sufficient for accepted socket values, or the contract identifies and refuses additional visibility restrictions (DEC-070; sec-2/sec-3).

Observed: .doctrine/slice/010/design.md:93-113 reuses only state-dir.nix's lexical absolute-path test. It accepts /home/operator/gateway/api.sock, /run/user/1000/gateway/api.sock and /tmp/gateway/api.sock. Sec-3:165-174 describes ownership/access and ProtectSystem=strict as the pertinent constraints, while :180-184 inherits the ssh relay's entire hardening. That block includes ProtectHome=tmpfs and PrivateTmp=true (host/services.nix:364-366), with no corresponding bind exposing the destination in the proposed unit (:138-145).

Documented systemd semantics: ProtectHome=tmpfs masks /home, /root and /run/user; PrivateTmp gives the unit private /tmp and /var/tmp. See https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#ProtectHome= and https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#PrivateTmp= . Consequently a socket the owner can successfully open outside the unit may not exist in the unit's mount namespace. The expected ENOENT failure for these otherwise valid declarations is inferred, not exercised live. This does not allege a problem for the proposed /run/llm-gateway-client path.

Repair: define the supported socket-location contract and pin refusals for masked locations, or explicitly expose the needed endpoint/parent while preserving the intended sandbox and socket-recreation behavior. The same visibility question applies to the newly configurable modelDoorDir used by ExecCondition; missing it fails closed rather than providing a usable door."""
disposition = "fix-now"
response = """
Verified: the shared hardening includes ProtectHome tmpfs and PrivateTmp (host/services.nix 364-366). model-door.nix refuses a socket under /home, /root, /run/user, /tmp or /var/tmp, with a reason naming the masking setting; negative cases for each. The modelDoorDir option fails closed when masked, and its description says it must sit outside those trees.
"""

