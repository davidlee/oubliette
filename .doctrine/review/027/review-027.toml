[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "The verification plan excludes transition and rollback branches despite an existing test seam"
detail = """
Expected: cases exercise the shipped front-end control flow for both live-unit transitions and failure/undo, substituting the thing tying it to this host, as CLAUDE.md:140-145 and POL-004 require. Actual sudo/systemd integration can remain a separate live obligation.

Observed: .doctrine/slice/010/design.md:416-429 tests only the down-VM mutation, query/refusal paths and start rendering, then declares the running-VM branch and its rollback unreachable because sudo/systemctl are runtimeInputs. That is precisely the obstacle the existing front end already solves: host/cli.nix:214-238 takes proxyControl as an injected fragment; host/policy-cases.nix:103-118 supplies controlled active/success/failure results; :426-450 actually drives the running proxy branch and asserts rollback of both the record and link. volumeControl also injects the VMM-state query (host/cli.nix:117-129). These are shipped-code seams, not PATH shadowing or copied test implementations.

The planned live sequence (design.md:436-443) contains only successful on/off operations; it does not deliberately fail a grant, state write or record commit. Consequently the core undo promise has no verifying instrument anywhere, and the start/off interleavings in F-1 are also absent. The assertion that every new case is mutation-checked (:367-369) cannot fill branches deliberately excluded from the cases.

Repair: extend or generalize the existing injected control seam for relay commands and VM state, and use policyCases to test on/off while running, unavailable commands, restoration of an absent versus existing bit, and failed post-hook record commits. Add a usable seam/criterion for the start-time render and its serialization rather than promising a start round that still has to execute the un-substituted lifecycle systemctl calls. Keep module checks for the literal sudo command spelling and live evidence for the real grant/wire. This is a design/testing requirement, not a claim that any Nix build or suite was run in this review."""
disposition = "fix-now"
route = "control"
