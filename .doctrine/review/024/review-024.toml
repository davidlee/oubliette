title = "expected 'a client never writes known_hosts' to be pinned; it rests on openssh disabling UpdateHostKeys implicitly"
detail = """
No `UpdateHostKeys` anywhere in host/*.nix. With UserKnownHostsFile overridden openssh defaults UpdateHostKeys off (from memory, unchecked). Case 6(c) "leaves known_hosts as (b) left it" cannot catch a regression: the fixture sshd offers one host key. The bind is read-only, so a write would fail rather than land.
"""
disposition = "follow-up"
response = """
IMP-024. A read-only bind already makes a write fail rather than land, so the gap is a missing pin, not exposure.
"""

