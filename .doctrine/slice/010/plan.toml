  { id = "EX-2", text = "Each `hostModuleUnits` assertion written red first; mutation recorded: an `after` naming another unit, and a missing grant, each turn their assertion red" },
  { id = "EX-3", text = "`wrapCases` asserts `CAPSULE_MODEL_DOOR_DIR` survives to the program" },
  { id = "EX-4", text = "The ssh relay's rendered unit is identical before and after `relayHardening` apart from `RestrictAddressFamilies` (diff in the notes)" },
  { id = "EX-5", text = "No gateway name, port or path in `host/` (POL-002): grep recorded in the notes" },
