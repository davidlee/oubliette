[[phase]]
id        = "PHASE-08"
name      = "The user's live run, recorded in docs/probes.md"
objective = """
Design sec-6 (live legs 1–9). The user rebuilds `/srv/fleet` (and `~/flakes`
if needed) with a door on one slot and runs the legs; the agent writes the
