  { id = "EX-2", text = "No `proxyControl`, `proxyActive` or `proxyRestart` remains in `host/`, `mkfleet.nix` or the suites" },
  { id = "EX-3", text = "`policyCases` green with its policy rounds unchanged except the log spelling; `hostModuleUnits` green; the shipped sudoers command text is byte-identical to before (compared in the phase notes)" },
  { id = "EX-4", text = "`just check` and `just` green; alejandra clean" },
