[[phase]]
id        = "PHASE-04"
name      = "recordWrite writes the candidate before the hook, and takes an optional undo"
objective = """
Design sec-4 (`recordWrite`'s order, `recordUndo`, the record), RV-027 F-2's
record half.

`host/record.nix`'s `recordWrite`: read, transform and write the candidate;
then `recordAlso`; then `mv`. If the `mv` fails after `recordAlso` succeeded,
call `recordUndo` when defined, and exit non-zero either way. The skeleton
gains `.model_door = (.model_door // null)`. The header comment's "Before, not
after" reasoning is rewritten for the new order (the hook still runs before the
commit, now after the candidate). The policy verb declares no undo and needs no
change.

Cases (in `policyCases`, through the policy verb, which is the only hook user
until PHASE-06): a malformed current record and an unwritable candidate each
fail with the hook never called (its link unmoved, `unitDo` not logged); a
failing `mv` after a successful hook returns non-zero with no generation
printed. `docs/contract-assignment.md` gains `model_door`.

**The `mv` becomes `mv -T`.** A plain `mv` onto a directory at
`assignment.json` exits 0 and buries the candidate inside it (checked at
planning, GNU coreutils): today such a directory silently swallows every record
write. `-T` makes that a failure, which is also the only sandbox-reachable way
to fail the final `mv` after a successful candidate write in the same
directory. The unwritable-candidate round makes the slot directory read-only
after `.lock` exists, since the lock is opened for writing in that directory.

The policy verb declares no `recordUndo`, so these rounds show only that the
hook is or is not reached and that a failed `mv` fails the write; the undo
being called is PHASE-06's, through the model verb."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 complete and committed" },
]
exit_criteria = [
  { id = "EX-1", text = "`recordWrite` order is read, transform, candidate, `recordAlso`, `mv -T`; `recordUndo` runs only on a failed `mv` after a successful hook" },
  { id = "EX-2", text = "Every record written carries `model_door` (null unless set); `docs/contract-assignment.md` says so" },
  { id = "EX-3", text = "RV-027 F-2 (probe, record half): through the policy verb, cases make the current record malformed, the candidate unwritable, and the `mv` fail (a directory at `assignment.json`); the first two never reach the hook (link unmoved, nothing logged), the third reaches it and fails with no generation printed; each red first" },
  { id = "EX-4", text = "Mutation recorded: moving the hook back ahead of the candidate write turns the unwritable-candidate round red" },
  { id = "EX-5", text = "Every existing `policyCases`, `volumeCases` and `roomVerbsCases` round green; `just check` and `just` green" },
]
verification = [
  { id = "VT-1", expects = "the new order and the undo hook", test_file = "host/record.nix", keywords = ["recordUndo", "recordAlso", "model_door", "mv -T"], waived = false },
  { id = "VT-2", expects = "commit-failure rounds through the policy verb", test_file = "host/policy-cases.nix", keywords = ["recordUndo", "malformed", "candidate"], waived = false },
  { id = "VT-3", expects = "the contract names the field", test_file = "docs/contract-assignment.md", keywords = ["model_door"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-05"
name      = "The relay unit, its place in the drop-in, its state directory and its grant"
objective = """
Design sec-3, sec-4 (state directory, the grant, the wrapper), sec-6
(`hostModuleUnits` cases, `wrapCases`), `DEC-070`, `DEC-072`.

`host/services.nix`:
- `relayHardening`: the ssh relay's keys `UMask` … `RestartSec` lifted into one
  attrset both relays merge; the ssh relay keeps `RuntimeDirectory`;
  `RestrictAddressFamilies = AF_INET AF_UNIX` for both. The ssh relay's
  rendered unit is otherwise unchanged (compared in the notes).
- `modelRelayServices`, `perInstance` over slots with `modelDoor != null`,
  exactly sec-3's unit (`ExecCondition` with the declared value and
  `<modelDoorDir>/<n>`; the one-line socat `ExecStart`; `bindsTo`/`after` the
  netns and tap only; `User = owner`; `IPAddressAllow` guest/32).
- the `microvm@` drop-in `wants` it for every declaring slot, independent of
  `uplink`.
- option `modelDoorDir` (default `/var/lib/capsule-model-door`, description
  naming the masked-tree misconfiguration); tmpfiles `d … 0755 owner users`.
- two sudoers commands per declaring slot (`start`, `stop`), by
  `unit-command.nix`, in the proxy's `mkAfter` rule; `ungranted` covers them.
- `paths.modelDoorDir` to `host/wrap.nix`, exported as
  `CAPSULE_MODEL_DOOR_DIR`; `wrapCases` asserts it survives.

The fixture (`fixture/default.nix`) declares `net.modelDoor` on a nobody's
socket (`/run/fixture-model-door/api.sock`) and slots for `on`, `off` and
undeclared. It has two slots today; the phase plan decides between a third
fixture slot and a second module eval, after grepping which suites enumerate
the fixture's slots (`fleet-cases.nix`, `host/profile-cases.nix`,
`host/git-channel-cases.nix`, `host/room-git-cases.nix`,
`host/room-verbs-cases.nix` name `beta`). Preference: a third slot, if no suite
pins the slot count."""
