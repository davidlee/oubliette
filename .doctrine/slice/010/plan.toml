  { id = "VT-2", expects = "hostModuleUnits pins the unit", test_file = "mkfleet.nix", keywords = ["capsule-model-relay-", "ExecCondition", "IPAddressAllow", "ungranted"], waived = false },
  { id = "VT-3", expects = "the wrapper exports the directory", test_file = "host/wrap.nix", keywords = ["CAPSULE_MODEL_DOOR_DIR", "modelDoorDir"], waived = false },
  { id = "VT-4", expects = "the wrapper case covers it", test_file = "host/wrap-cases.nix", keywords = ["CAPSULE_MODEL_DOOR_DIR"], waived = false },
