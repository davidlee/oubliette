[[phase]]
id        = "PHASE-03"
name      = "One spelling of a unit command, and the front end's unitControl seam"
objective = """
Design sec-4 (the grant, the seam). A refactor: no behaviour changes, and the
policy verb's rounds are the proof.

- `host/proxy-restart.nix` becomes `host/unit-command.nix`, `verb: unit:
  "/run/current-system/sw/bin/systemctl ${verb} ${unit}"`; its header keeps
  NOTES item 44's reasoning. Every importer (`host/cli.nix`,
  `host/services.nix`, `mkfleet.nix`) moves to it.
- `host/cli.nix`'s `proxyControl` becomes `unitControl`: `unitActive <unit>`
  and `unitDo <verb> <unit>` (`sudo` of `unit-command.nix`'s spelling). The
  policy verb's proxy query and restart call them.
- `host/policy-cases.nix`'s substitute moves to `unitControl`: `unitDo` logs
  `<verb> <unit>` and can be told to fail. The existing policy rounds pass
  with only the log line's spelling changed.
- `mkfleet.nix`'s `unrestartable` becomes `ungranted`, its message unchanged
  in meaning; the proxy restart is its only member until PHASE-05."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete and committed" },
  { id = "EN-2", text = "Memories retrieved: `mem.fact.oubliette.policy-verb-is-owner-only`, `mem.fact.oubliette.two-copies-refuse-in-different-orders`" },
]
exit_criteria = [
