  { id = "VT-2", expects = "the front end's seam is unitControl", test_file = "host/cli.nix", keywords = ["unitControl", "unitActive", "unitDo", "unit-command.nix"], waived = false },
  { id = "VT-3", expects = "the suite substitutes unitControl", test_file = "host/policy-cases.nix", keywords = ["unitControl", "unitDo"], waived = false },
