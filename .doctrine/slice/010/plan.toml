[[phase]]
id        = "PHASE-06"
name      = "capsule <n> model on|off, the status column, and the rounds that pin them"
objective = """
Design sec-4 (the verb, its hooks, the concurrent-start rules, D-3), sec-6
(`policyCases` extended), RV-027 F-1, F-2, F-4.

`host/cli.nix`:
- `capsule <n> model [on|off]`, refusals 1–5 of sec-4's table in `policy`'s
  order; `effectiveModelDoor` (override from the record, else the declaration,
  `-` for none).
- `recordAlso`: remember the previous override; publish the new one by
  temp-file + `mv` in `$CAPSULE_MODEL_DOOR_DIR`, refusing before any unit
  command if that fails; `off` → `unitDo stop`, always; `on` → `unitDo start`
  only when `vmmState` is `running`; a failed unit command restores the
  previous override (or removes it) by the same publication, and a failed
  restore reports an unknown state.
- `recordUndo`: restore the previous override, stop the relay; a failure
  names the slot and says the state is unknown.
- `capsule all status` gains the `model` column after `relay` (`--`,
  `inactive`, `running`). IMP-009 gets a note; the table is not reshaped.

`host/policy-cases.nix`: the fixture pool gains `modelDoor` on two slots and
`net.modelDoor`; `vmmState` can be told running / stopped / activating. Every
round listed in sec-6, and every mutation listed there."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03, PHASE-04 and PHASE-05 complete and committed" },
  { id = "EN-2", text = "RV-027 F-1, F-2, F-4 re-read on the ledger (`doctrine review show RV-027 --full -f F-1 -f F-2 -f F-4`); this phase's EX rows are their transcription" },
]
exit_criteria = [
  { id = "EX-1", text = "The verb's five-row table holds in `policy`'s order, each refusal asserted with its reason in `policyCases`, including refusal 4 on a copy with no `CAPSULE_MODEL_DOOR_DIR`" },
  { id = "EX-2", text = "RV-027 F-1 (probe; adapted to the locked design, where `start` writes nothing): with `vmmState` stopped, running and activating, `off` always logs `stop` and writes record and override `off`; `on` logs `start` only when running. Asserted invariant across every round: never a record `off` with a `start` as the last relay command. Pausing at a lock boundary is not needed because the verb is the only writer (design sec-4)" },
  { id = "EX-3", text = "RV-027 F-2 (probe, verb half): a failed `mv` after the hook runs each row of sec-4's undo table from its stated starting state — override as before, relay stopped (logged `stop`), record unchanged; a failed undo reports an unknown state" },
  { id = "EX-4", text = "RV-027 F-4 (control): rounds for a failed override write (unwritable `modelDoorDir`; `on` and `off`; from an existing and an absent override) asserting no `unitDo` logged, no record, override unchanged, reason named; a failed unit command restoring or removing the override with no record; a failed candidate write moving nothing" },
  { id = "EX-5", text = "RV-027 F-4 (control) mutations, each turning its round red, recorded in the phase notes: no restore when the stop fails; restoring `on` where there was no file; an `off` that skips the stop when the VM is not running; an undo that restores the relay to up; a hook that ignores a failed override write" },
  { id = "EX-6", text = "`capsule all status` has a `model` header after `relay` and a cell in every row, asserted in `policyCases` by reading the cell by its header name (as the profile cell is). In a sandbox `unitState` answers `--` for every unit, since `systemctl` cannot be stubbed, so the `inactive`/`running` values are live legs 5 and 7, not a case; IMP-009 carries the note" },
  { id = "EX-7", text = "`just check` and `just` green; alejandra clean; RV-027 F-4 re-submitted to the raiser for verification against EX-4/EX-5" },
]
verification = [
  { id = "VT-1", expects = "the verb, its hooks and the status column", test_file = "host/cli.nix", keywords = ["effectiveModelDoor", "recordUndo", "CAPSULE_MODEL_DOOR_DIR", "capsule-model-relay-", "declares no model door"], waived = false },
  { id = "VT-2", expects = "the transcribed F-1/F-2/F-4 rounds and the status column", test_file = "host/policy-cases.nix", keywords = ["model on", "model off", "activating", "recordUndo", "modelDoorDir", "unitDo", "model"], waived = false },
  { id = "VA-1", text = "Reviewer reads each EX-2..EX-5 round against sec-4's text and the RV-027 response it transcribes, and confirms none tests a weaker property than the finding asked for" },
]
