# Implementation plan for SL-010 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-010"

[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order. Ids are immutable.
[[phase]]
id        = "PHASE-01"
name      = "The declaration evaluates and refuses: host-path.nix, model-door.nix, modelDoorCases"
objective = """
Design sec-2, sec-6 (`modelDoorCases`, `stateDirCases`), `DEC-069`, `DEC-071`.
Pure eval; nothing on the host moves.

- `host-path.nix` (new, root): `{lib}: {allowed; why;}`, the predicate and
  character set moved out of `state-dir.nix`. `state-dir.nix` keeps its
  interface and its exact message, built from `why`. `stateDirCases` is
  unchanged and is the regression check on the move.
- `model-door.nix` (new, root): `{lib}: {modelDoor, slots, proxyPort}:
  {reasons; value;}`, the five refusals of sec-2 in order, each message naming
  the field, the value and the decision; `value` throws the first reason.
- `capsules.nix`'s `recordOf` gains `modelDoor ? null` and carries it into the
  instance record.
- `mkfleet.nix` reads `model-door.nix`'s `value` where it reads `stateDir`'s,
  so every caller's eval refuses. `net.modelDoor` stays optional: absent means
  no door anywhere, and every existing caller (fixture, template, consumer)
  evaluates unchanged.
- `modelDoorCases` (`model-door-cases.nix`, root, beside its subject): one
  round per sec-6 row, `builtins.tryEval` over `deepSeq`, asserting verdict
  and reason; plus an accepted declaration whose `value` is the input. Wired
  into the flake's suites, `just build`, `just cases` and `justfile`'s
  `nix_paths` in the same commit (NOTES item 51 step 3)."""
entrance_criteria = [
  { id = "EN-1", text = "SL-010 design locked (run rev 39); the plan is approved by the user" },
  { id = "EN-2", text = "`just check` and `just` green at the phase's base commit" },
  { id = "EN-3", text = "Memories retrieved: `mem.pattern.oubliette.forcing-is-not-building` and the dirty-flake gotcha (a new file is invisible to a `git+file:` eval until `git add`)" },
]
exit_criteria = [
  { id = "EX-1", text = "`host-path.nix` holds the predicate; `state-dir.nix` builds its unchanged message from it; `stateDirCases` green with no edit" },
  { id = "EX-2", text = "`model-door.nix` refuses each of sec-2's five cases with its reason; `mkfleet.nix` forces its `value` beside `stateDir`'s" },
  { id = "EX-3", text = "`modelDoorCases` green, each round written red first; wired into `just build`, `just cases` and `nix_paths`, and its failure fails `just build`" },
  { id = "EX-4", text = "Mutation recorded in the phase notes: dropping the masked-tree refusal (5) and widening the port floor to 1 each turn their round red for the reason" },
  { id = "EX-5", text = "The fixture, the template and every existing suite evaluate unchanged (no `net.modelDoor` declared yet)" },
  { id = "EX-6", text = "`just check` and `just` green; alejandra clean" },
]
verification = [
  { id = "VT-1", expects = "model-door.nix carries the five refusals and the reasons/value shape", test_file = "model-door.nix", keywords = ["reasons", "value", "proxyPort", "1024", "65535", "ProtectHome", "PrivateTmp", "host-path.nix"], waived = false },
  { id = "VT-2", expects = "modelDoorCases asserts each verdict and its reason", test_file = "model-door-cases.nix", keywords = ["modelDoorCases", "tryEval", "deepSeq", "/run/user", "/var/tmp", "65536"], waived = false },
  { id = "VT-3", expects = "state-dir.nix reads its predicate from host-path.nix", test_file = "state-dir.nix", keywords = ["host-path.nix", "why"], waived = false },
  { id = "VT-4", expects = "recordOf carries the field", test_file = "capsules.nix", keywords = ["modelDoor ? null"], waived = false },
  { id = "VT-5", expects = "the suite is in just build and just cases", test_file = "just/fleet.just", keywords = ["modelDoorCases"], waived = false },
  { id = "VT-6", expects = "the new root files are parsed and formatted by just check", test_file = "justfile", keywords = ["host-path.nix", "model-door.nix", "model-door-cases.nix"], waived = false },
]
specs        = []
requirements = []

