[[phase]]
id        = "PHASE-07"
name      = "The live rung: the assistant on this host holds two real repos, and push, session and collect work through the door"
objective = """
Design sec-8's live rung (`STD-001`). On the user's edit of `/srv/fleet`
adding `repos`, `policy` and `sizes.work` to the live assistant, and the user's
rebuild in `~/flakes`: `capsule assistant push <repo> <branch>` prints an oid;
`session <repo> -- git switch -c job/<id> <oid>` and a commit through it;
`capsule assistant collect <repo> job/<id>` lands in that repo's quarantine and
no other; the banner pre-flight answers 75 with the room stopped; a changed host
key refuses at the front end and both channel verbs until `forget-host-key`;
stop/start keeps clones, uids and host keys; a slot `capsule-collect` still
lands its refs on the shared fetch fragment (RV-015 F-5). The closure size with
two tool sets is measured and recorded as an EVD against `EVD-007`. `ISS-021`
and `RSK-011` close. The sec-6 relay to satan SL-023 is the user's act."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-06 complete and committed" },
  { id = "EN-2", text = "the user has edited `/srv/fleet` and rebuilt this host (both the user's acts, never the agent's)" },
]
exit_criteria = [
  { id = "EX-1", text = "each live observation above is recorded with its command and output in the phase notes, and what was not exercised is said" },
  { id = "EX-2", text = "the closure-size EVD is recorded (`ADR-003`), citing `EVD-007`" },
  { id = "EX-3", text = "`ISS-021` and `RSK-011` closed, citing `DEC-043` and `DEC-047`" },
]
verification = [
  { id = "VH-1", expects = "the user's /srv/fleet edit and host rebuild" },
  { id = "VA-1", expects = "push, session commit, collect into the right quarantine, 75 with the room stopped, host-key refusal and recovery, stop/start persistence, and a slot collect — each observed and recorded" },
  { id = "VA-2", expects = "the closure EVD recorded and ISS-021/RSK-011 closed" },
]
