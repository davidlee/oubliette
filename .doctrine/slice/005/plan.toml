  { id = "EX-3", text = "the satan relay text is in the slice notes, for the user to send, and covers what the planning read of satan's SL-023 found: ASM-005 can settle on sec-6 (socket, `agent@<net.guest>`, `HostKeyAlias`); `guest_path` is the target's `guestPath`, not runner config, and the room channel is a follow-on slice (ISS-021); promotion is a plain `git fetch` from `/var/lib/capsule/collect/<room>/<target>.git`, with no land verb (DEC-040, satan DEC-061); the runner must run as the module owner, since the socket is 0600; and a stop is a reboot that cuts in-flight work, not a graceful stop" },
