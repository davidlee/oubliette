[[phase]]
id        = "PHASE-09"
name      = "live: a room with no way out, and a door that works"
objective = """
The user's run, as root, after bumping the oubliette input in `/srv/fleet` and
declaring `rooms.assistant` (design sec-8, sec-9 Live steps 1–4). This is
where RV-014 F-6 (route demonstrate) is settled: the argv of `capsule <room>
ssh`, `start` and `stop` is proven by behaviour. Evidence goes in
`docs/probes.md` per `STD-001`, with what it does not prove."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-08 complete; oubliette pushed with the user's word" },
  { id = "EN-2", text = "the user has bumped the input and declared `rooms.assistant` in `/srv/fleet`, and switched" },
]
exit_criteria = [
  { id = "EX-1", text = "step 1: `capsule assistant start`; `room-assistant` has no default route and only `lo` and the tap; the guard reports N+1 namespaces" },
  { id = "EX-2", text = "step 2, demonstrate RV-014 F-6: `capsule assistant ssh` reaches `agent`; `ssh -F` with the `ProxyCommand` line reaches it as a client would; the serial console asks for a login" },
  { id = "EX-3", text = "step 3, both directions: from inside, no resolution, TCP to `net.host` refused, TCP off the `/30` gets no route; the door still works" },
  { id = "EX-4", text = "step 4, demonstrate RV-014 F-6: a probe refuses while the room runs; `capsule assistant stop` exits through the stop key; the probe then runs" },
  { id = "EX-5", text = "`docs/probes.md` records the run, citing the commit, with sec-9's not-proven list" },
]
verification = [
  { id = "VH-1", expects = "the user ran sec-9 Live steps 1–4 as root and the transcript excerpts are in docs/probes.md" },
  { id = "VT-1", expects = "the evidence is recorded", test_file = "docs/probes.md", keywords = ["room-assistant", "SL-005"], waived = false },
]
specs        = []
requirements = []
