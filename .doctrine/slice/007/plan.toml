[[phase]]
id        = "PHASE-05"
name      = "Live: after the user's rebuild, git inside session is the base's with no caller PATH"
objective = """
Design sec-4 "Live". The user rebuilds the host with this repo, which changes
the assistant room's `PATH` for every satan job (design sec-6, flagged). Then,
from this host:
`capsule assistant ssh agent -- env -i /run/current-system/sw/bin/session <repo> -- sh -c 'command -v git'`
prints a path under `/etc/room/base` (or its store target), with no `PATH` from
the caller. An interactive login to the room has a declared extra on `PATH`, if
the consumer declares one; otherwise the floor's `which`. Record the output in
notes, along with what was not exercised: two extras colliding, and the three
host programs live with no system `jq`. The satan relay line (design sec-6) is
drafted here for the user to deliver."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 committed and pushed as far as the consumer's lock needs (`mem.fact.oubliette.target-input-reads-pushed-edge` and `mem.fact.oubliette.flakes-builds-this-repo-two-ways` for which way)" },
  { id = "EN-2", text = "The user has rebuilt and restarted the assistant room" },
]
exit_criteria = [
  { id = "EX-1", text = "The `env -i` check's output is recorded in notes and names the base's `git`" },
  { id = "EX-2", text = "The interactive-login check is recorded" },
  { id = "EX-3", text = "The satan relay line is drafted for the user" },
]
verification = [
  { id = "VH-1", expects = "the user runs the rebuild and accepts the live outputs" },
  { id = "VA-1", expects = "the outputs recorded in notes match design sec-4's live claims" },
]
specs        = []
requirements = []
