# Implementation plan for SL-001 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-001"

[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

[[phase]]
id        = "PHASE-01"
name      = "The profile-name grammar, and `-` reserved"
objective = """
One predicate for a profile name's shape (host/profile-name.nix), applied at eval
to a slot's declared profile and held to profileLoad's shell spelling by a
table. `-` refused by profileLoad, the validator and the assertion. profileLoad's
hint corrected. The `profile` field exists in recordOf, defaulting to null; no
slot declares one yet, so the assertion holds without any declaration. Design sec-2, and sec-3's profileLoad changes.
"""
entrance_criteria = [
  { id = "EN-1", text = "Design run locked (revision 55); `just build` green at HEAD." },
]
exit_criteria = [
  { id = "EX-1", text = "host/profile-name.nix exists, builtins only, refusing '', '.', '..', '-', and any name containing / newline tab $ or backtick." },
  { id = "EX-2", text = "capsules.nix: `profile ? null` in recordOf; imports the predicate; exports `misprofiledIn`; asserts `misprofiled` beside `undeclared`; the field's comment carries the convenience warrant, says there is no `profiles` set, and says only the shape is checked here." },
  { id = "EX-3", text = "host/profile.nix: profileLoad refuses `-` beside `.` and `..`; the validator refuses a document whose name is `-`; the hint reads 'rendered from target.nix by the module, or placed there by hand (docs/contract-target.md)'." },
  { id = "EX-4", text = "flake.nix hands profileCases `capsules`; docs/contract-target.md says `-` is reserved." },
  { id = "EX-5", text = "`just` (check, build, units) green; committed." },
]
verification = [
  { id = "VT-1", expects = "profileCases: the one-grammar-two-spellings table (solo, 'a b;c', '', '.', '..', '-', x/y, a$b, backtick, newline, tab) agrees across profileNameOk and profileLoad, except the four render-only characters", test_file = "host/profile-cases.nix", keywords = ["one grammar, two spellings", "profileNameOk"], waived = false },
  { id = "VT-2", expects = "profileCases: misprofiledIn over { good.profile = \"solo\"; bad.profile = \"-\"; none = {}; } is [ \"bad\" ]", test_file = "host/profile-cases.nix", keywords = ["misprofiledIn is the predicate over a set"], waived = false },
  { id = "VT-3", expects = "profileCases: profileLoad refuses `-` as reserved; the validator refuses a document named `-`; the missing-document refusal carries the new hint", test_file = "host/profile-cases.nix", keywords = ["placed there by hand", "reserved"], waived = false },
  { id = "VA-1", expects = "Mutations from design sec-5, each watched red and recorded in the phase sheet: let `-` through profileLoad; let `$` through profileNameOk; make misprofiledIn read .profiles; revert the hint." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "The status cell brackets what is not a record"
objective = """
DEC-014 on the resolution that exists today, the sole document: profileCell
brackets any name that no record gives, keeps the drift marker on a
record-less pin, and the profile and memory columns widen so the header lines up
with its rows. Status cases read the profile field by its column. Design sec-3,
"The status cell".
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete; `just build` green." },
]
exit_criteria = [
  { id = "EX-1", text = "profileCell decides brackets by `recordField \"$n\" profile` alone, and runs the same pin/`*`/`!` logic for both, printing the bracketed name." },
  { id = "EX-2", text = "statusFmt's profile column is %-11s and its memory column %-12s; the header text is unchanged." },
  { id = "EX-3", text = "Existing policyCases assertions that expected a bare name for an unassigned slot now expect brackets — updated, not deleted." },
  { id = "EX-4", text = "policyCases reads the profile field by its column (the characters under the header's `profile` label up to the `policy` label) through one helper, and every status case uses it." },
  { id = "EX-5", text = "`just` (check, build, units) green; committed." },
]
verification = [
  { id = "VT-1", expects = "policyCases: with one document, an unassigned undeclared slot's cell is [solo]; a record is bare and still carries * and !", test_file = "host/policy-cases.nix", keywords = ["the sole document is bracketed"], waived = false },
  { id = "VT-2", expects = "policyCases: a hand-written pin in an unassigned slot's pin directory, with the host document then edited, reads [solo]*", test_file = "host/policy-cases.nix", keywords = ["a record-less pin keeps its drift marker"], waived = false },
  { id = "VT-3", expects = "policyCases: for every column the header label starts at the row value's offset (fails under the old %-11s memory column)", test_file = "host/policy-cases.nix", keywords = ["the header lines up with its rows"], waived = false },
  { id = "VA-1", expects = "Mutations watched red and recorded: drop the bracket; return early for a bracketed name, skipping the drift logic; leave the memory column at %-11s. The %-9s profile-column mutation needs a ten-character cell and is PHASE-03's (the `decl` slot)." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "A slot declares its profile, and the front end resolves it"
objective = """
The declared step itself: all ten slots declare `doctrine` (DEC-016); the front end
renders slotDeclaredProfile, escaped, with a `*)` branch; profileNameFor gains its
fourth step; every other caller of the resolver behaves as design sec-3's table says
(slotNeedsUnit answer 3, recordUnit, handoff's 'declares'). POL-002 and
POL-003 are revised, and the documents that state the resolution order move with
them, in the same commit.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 complete; `just build` green." },
  { id = "EN-2", text = "POL-002 and POL-003 revisions drafted with `doctrine revision` in DEC-012's wording (sec-2's quoted sentence, including the comment/.doctrine/tool-configuration exclusions and the fixture clause)." },
]
exit_criteria = [
  { id = "EX-1", text = "capsules.nix: all ten slots `profile = \"doctrine\"`; `misprofiled` still empty." },
  { id = "EX-2", text = "host/cli.nix: slotDeclaredProfile rendered per instance through lib.escapeShellArg, a null profile and the `*)` branch both echo `-`; profileNameFor's declared step sits between record and sole document, with the header comment saying it is the operator's convenience, not the front end's latitude." },
  { id = "EX-3", text = "slotNeedsUnit returns 3 for resolved-but-will-not-load; recordUnit refuses on 3 with profileLoad's message; unitScope unchanged; handoff says \"'<slot>' declares X\" when no record names the profile." },
  { id = "EX-4", text = "policyCases: stub also writes out.args (argc, then each argument bracketed per line); fixture slots dflt=solo, hole=holed, decl=unbacked, odd='a b;touch pwned'; none/one/both stay undeclared." },
  { id = "EX-5", text = "POL-002 and POL-003 revisions applied; docs/contract-target.md (the resolution paragraph at lines 113–120 and the POL-002 sentence), docs/contract-assignment.md (`profile` row gains the per-slot default, no set) and docs/plan-d-fleet.md L1 updated in the same commit." },
  { id = "EX-6", text = "`just` (check, build, units) green; committed." },
]
verification = [
  { id = "VT-1", expects = "policyCases resolution and precedence: declared resolves on a several-document host; record beats declaration; flag beats both; undeclared slots still refuse naming every document", test_file = "host/policy-cases.nix", keywords = ["the record beats the declaration", "the flag beats both"], waived = false },
  { id = "VT-2", expects = "policyCases: odd collect's out.args carries 'a b;touch pwned' as one argument and no file pwned exists", test_file = "host/policy-cases.nix", keywords = ["a declared name is spliced literally", "out.args"], waived = false },
  { id = "VT-3", expects = "policyCases refusals at use: decl provision exits 1 naming 'unbacked' and the directory with empty out.argv; decl unit is not recorded; decl collect gets no --unit", test_file = "host/policy-cases.nix", keywords = ["a misdeclared slot's provision refuses naming the directory", "a misdeclared slot's unit is not recorded"], waived = false },
  { id = "VT-4", expects = "policyCases: hole unit u1 records and hole collect gets --unit u1; handoff from a duo-recorded slot to dflt refuses with 'dflt' declares solo; status: dflt reads [solo], decl reads [unbacked] and its row lines up", test_file = "host/policy-cases.nix", keywords = ["a declared unassigned slot scopes by unit", "handoff to a declared destination says", "a misdeclared slot reads"], waived = false },
  { id = "VA-1", expects = "Mutations watched red and recorded: drop the fourth step; move it ahead of the record; ahead of the flag; drop escapeShellArg (out.args splits, pwned exists); collapse answer 3 into 2; drop 'declares'; leave the profile column at %-9s (decl's row). Dropping the `*)` branch is recorded as not exercised." },
  { id = "VA-2", expects = "The revised POL-002's search, run and its output kept in the phase sheet: the target's name in *.nix, *.sh and the justfile, outside comments, .doctrine/ and tool configuration, hits only target.nix, inputs.target.url, capsules.nix's profile values and the .doctrine/ layout fixtures in brief-cases and state-snapshot-cases." },
  { id = "VH-1", expects = "The user approves the POL-002 and POL-003 revisions before they are applied." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-04"
name      = "A provision resolves once and records only when it completed, with the pin"
objective = """
Objective 4a, design sec-3: provisionSlot forwards the profile it resolved as
--profile unless the caller gave one, checks work's status and says nothing
was recorded; recordProvisioned asks the guest for HEAD first, then pins and
writes the record once, checking the write, and deletes .base when the guest is
silent.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 complete; `just build` green." },
]
exit_criteria = [
  { id = "EX-1", text = "provisionSlot: `--profile \"$prof\"` prepended for the program only when the caller gave none; recordProvisioned still gets the original argv; `work` failure prints the nothing-recorded message and returns 1." },
  { id = "EX-2", text = "recordProvisioned: HEAD asked before pinProfile; one recordWrite sets profile, class, profile_snapshot and sets or deletes base, followed by `|| return 1`; a silent guest warns and returns 0 with a record." },
  { id = "EX-3", text = "policyCases' stub exits 1 after printing 'the code landed' when CASE_PROGRAM_FAIL is set." },
  { id = "EX-4", text = "`just` (check, build, units) green; committed." },
]
verification = [
  { id = "VT-1", expects = "policyCases: dflt provision <ref> carries --profile solo exactly once and record, class and pin all say solo; with --profile duo given, once", test_file = "host/policy-cases.nix", keywords = ["a provision's argv, record and pin agree"], waived = false },
  { id = "VT-2", expects = "policyCases: under handoff with CASE_PROGRAM_FAIL, exit 1, the nothing-recorded message, the destination's pin digest and record generation unchanged", test_file = "host/policy-cases.nix", keywords = ["CASE_PROGRAM_FAIL", "nothing was recorded"], waived = false },
  { id = "VT-3", expects = "policyCases: re-provision with a silent guest exits 0 with the warning, the record names profile and snapshot, .base is gone, status shows solo bare", test_file = "host/policy-cases.nix", keywords = ["a silent guest still leaves a record"], waived = false },
  { id = "VA-1", expects = "Mutations watched red and recorded: forward --profile even when given (two flags); drop the check on work; ask HEAD after the pin and skip the record when silent; leave .base in place. The race closed by forwarding, and the record-write check, are recorded as not exercised (design sec-5)." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-05"
name      = "Source is the document's path, and nothing stands in front of it"
objective = """
ISS-008 and DEC-013, design sec-4: the wrapper stops supplying CAPSULE_REPO; the
`repo` option is removed with mkRemovedOptionModule, checked inside hostModule's
`checked`; wrapCases proves the program's own fallback is reached; handoff
refuses when the source's pinned path is not this host's; every sentence the
change makes false is corrected in the same commit.
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 complete; `just build` green." },
  { id = "EN-2", text = "The prose sweep from design sec-4 (grep for five, cfg.repo, paths.repo, capsule-perimeter.repo, CAPSULE_REPO; `doctrine memory search` for the same) is run and its hits recorded in the phase sheet before any edit." },
]
exit_criteria = [
  { id = "EX-1", text = "host/wrap.nix: four defaults; header says four and why CAPSULE_REPO is not an exception table (its fallback is a value from the resolved document, not a baked one)." },
  { id = "EX-2", text = "host/services.nix: `repo` option gone, replaced by mkRemovedOptionModule naming the document's path and CAPSULE_REPO; paths stop passing repo; its comments corrected." },
  { id = "EX-3", text = "flake.nix: hostModule's `checked` evaluates the module with repo set and throws, naming which check failed — options unreadable, or no assertion naming the document's path; wrapCases handed hostPrograms.provision and a declared slot, as gitChannelCases is, with the comment saying why." },
  { id = "EX-4", text = "host/cli.nix: handoff compares the source's pinned path with this host's document of the same name before collecting, and refuses naming both." },
  { id = "EX-5", text = "Every row of design sec-4's prose table corrected (git-channel.nix, cli.nix moduleState comment, services.nix, wrap.nix, wrap-cases.nix, contract-target.md rows 75/76/352, CLAUDE.md, README.md 276 and 512–517), contract-assignment.md's source row and its bullets, 'two host-side overrides' → one, plan-d-fleet.md line 380, and both memories via `doctrine memory edit`. The post-edit sweep leaves only the readers, the cases, and the sentences saying a caller may set CAPSULE_REPO." },
  { id = "EX-6", text = "`just` (check, build, units) green; committed." },
]
verification = [
  { id = "VT-1", expects = "wrapCases: the set case names exactly four; the composition case runs the shipped provision, wrapped, under env -i, `--capsule \"$slot\" --profile doc` with no ref, and the refusal names /fixture/doc-repo", test_file = "host/wrap-cases.nix", keywords = ["/fixture/doc-repo", "exactly these and no others"], waived = false },
  { id = "VT-2", expects = "policyCases: a handoff whose source pin's path differs from this host's document refuses naming both paths, with no collect in out.argv and the destination's record and archive untouched", test_file = "host/policy-cases.nix", keywords = ["a handoff from a moved checkout refuses"], waived = false },
  { id = "VT-3", expects = "policyCases: a fetch with CAPSULE_REPO unset lands in the sandbox document's path", test_file = "host/policy-cases.nix", keywords = ["a fetch with nothing set lands in the document's path"], waived = false },
  { id = "VT-4", expects = "gitChannelCases' 'CAPSULE_REPO still beats the document' stays green; hostModuleUnits builds", test_file = "host/git-channel-cases.nix", keywords = ["CAPSULE_REPO still beats the document"], waived = false },
  { id = "VA-1", expects = "Mutations watched red and recorded: put CAPSULE_REPO back in defaults with today's fixture (composition case names /fixture/repo, set case); delete or misname the shim, then drop its message (`just build` fails at checked on the first check, then the second); drop handoff's path comparison." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-06"
name      = "The module path on this host"
objective = """
Closure evidence a suite cannot give (design sec-5, 'Not exercised'): after the
user rebuilds the host from ~/flakes, read-only checks on the live module path
show brackets and the declared default, and show that a provision resolves
source from the document's path (ISS-008 closed on the module path).
"""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-05 committed; the user has updated ~/flakes' lock to this repo's HEAD and switched the host (the user runs system builds)." },
]
exit_criteria = [
  { id = "EX-1", text = "Evidence recorded in the slice notes, saying what it does not prove (STD-001, ADR-003)." },
  { id = "EX-2", text = "`~/flakes`' comment naming `repo` flagged to the user (outside this repo)." },
]
verification = [
  { id = "VH-1", expects = "`capsule all status`: every unassigned slot reads [doctrine], records stay bare, header aligned." },
  { id = "VH-2", expects = "On a started, unassigned slot that is not c: `capsule <slot> provision --profile panopticon` with no ref refuses naming panopticon's path, not doctrine's; nothing is pinned or recorded." },
]
specs        = []
requirements = []
