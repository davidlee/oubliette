- `docs/contract-flavour.md`: capability fragments move from unbuilt to built,
  for rooms. It describes the `guestModule`/`persist` keys, that the guest owns
  persistence, and that slots refuse one. The `item 4` row stays a possibility.
- README, a new section "PostgreSQL in a room" (user, 2026-10-24) covering:
  selecting `postgresql-18`; each login's own database and the `samerole`
  rule; who can be the superuser (guest root by admin key via
  `capsule <room> ssh root`, then `runuser -u postgres -- psql`; no room user
  can); the shared-database recipe and its `shared_` naming rule; the
  `ssh -L` forward; readiness via `postgresql.target`; reset, backup and the
  major-version bump; and that the data shares `/home`.
- `templates/fleet/flake.nix`: the rooms comment points to that section.
- `CLAUDE.md`: `fragmentsCases` joins the suite list, and the fixture count
  goes from "Seventeen" to "Eighteen", with a clause saying the new suite is
  handed evaluated fixture rooms.
- `doctrine memory record`: the superuser path, scoped to `fragments.nix` and
  `vm/room.nix`."""
