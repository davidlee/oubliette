[[phase]]
id        = "PHASE-05"
name      = "Live: the user runs the six checks on a room selecting postgresql-18"
objective = """
Design sec-6 live list, `DEC-064`, RV-025 F-1 and F-5 (route demonstrate).
These validate `ASM-005` (systemd orders the bind after `/home`, and postgres
after the bind) and `ASM-006` (a forwarded connection reaches peer auth as the
logged-in user). They need a live room host, so the user runs them. The agent
writes the commands up, records the result at the rung reached (STD-001),
settles ASM-005/006 on the evidence, and reports any step not run as not
exercised.

1. Start the room; check `systemctl is-active postgresql.target`, that
   `findmnt /var/lib/postgresql` has its source on `/home`, and that
   `stat -c %a /home/.fragments` is `700`.
2. As `agent`: `psql -c 'create table t(x int); insert into t values (1)'`.
3. Stop and start the room; `psql -c 'select * from t'` returns `1`, and, as
   root (`/home/.fragments` is `0700` root's, so a login cannot traverse it),
   `/home/.fragments/postgresql-18/var/lib/postgresql` is still owned by
   postgres.
4. From the host: `ssh -L` the socket over the door, then `psql` through it as
   `agent`.
5. As `eve` with her own role: `psql -U eve -d agent` is refused, and
   `psql -d eve` succeeds.
6. As root, run the sec-4 recipe for `shared_proj`, granted to `agent` only:
   `agent -d shared_proj` succeeds and `eve -d shared_proj` is refused."""
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 complete and committed; a host with the room module can build and start a room selecting `postgresql-18`" },
]
exit_criteria = [
  { id = "EX-1", text = "RV-025 F-5 (demonstrate): step 1 run, its output quoted, showing `postgresql.target` active, the bind sourced from `/home`, and `/home/.fragments` mode 700" },
  { id = "EX-2", text = "RV-025 F-1 (demonstrate): steps 5 and 6 run, their output quoted, showing own-role/other-database refusal and shared-role membership admission and refusal" },
  { id = "EX-3", text = "ASM-005 and ASM-006 settled (validated or refuted) through `doctrine knowledge` on the quoted evidence from steps 1-4" },
  { id = "EX-5", text = "Only if the user explicitly defers a step: the deferral is quoted in the phase notes, the step is reported not exercised (STD-001), the ASM it bears on stays open, and a backlog item carries it. A deferral does not satisfy EX-1..EX-3; it is what audit reads instead" },
  { id = "EX-4", text = "The results, and the rung each reached, are recorded in the phase notes" },
]
verification = [
  { id = "VH-1", text = "User runs steps 1-3 (ordering, readiness, persistence across stop/start) and reports output" },
  { id = "VH-2", text = "User runs step 4 (peer auth through a forward over the door) and reports output" },
  { id = "VH-3", text = "User runs steps 5-6 (database exclusion and shared-role membership) and reports output" },
]
specs        = []
requirements = []
