summary = "capsule-phase-planner hit its 40-turn cap on SL-004 PHASE-09 without writing the sheet"
detail = "Planner was asked to fill phase-09.md for a repo-side cutover (relock, policyDir default, manifest verify, host checklist). It spent 41 tool calls reading (plan, design, RV-012, memories, ~/flakes) and ended with no hand-back and no file written; the sheet is still the empty materialised template. Orchestrator proceeded by giving the worker the task list directly and having it fill the sheet first. A planner should write the sheet incrementally, or its turn cap is too low for a phase whose reading list spans two repos."

