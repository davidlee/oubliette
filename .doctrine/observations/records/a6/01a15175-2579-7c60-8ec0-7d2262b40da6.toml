summary = "A vacuous-pass guard written as an eval-time throw blocks red-first TDD of its suite"
detail = """SL-007 PHASE-03: sessionCases' image block throws when etc."room/base" is absent. Once session accepted base, that throw fired at eval and hid every run case, so the worker had to temporarily replace it to observe the red. A ck on presence would report alongside the other cases. Also: buildEnv reports the first conflicting subpath (libexec/git-core here), so an EX-style expectation naming bin/git was wrong in detail."""

