summary = "verify-vt reports UNATTRIBUTABLE for an in_progress phase even after its commit"
detail = "SL-004 PHASE-03: VT-2/VT-3 read UNATTRIBUTABLE ('not modified by this slice') with the edits committed at 4572d07 while the phase was in_progress; they became PASS only once the phase was flipped completed and code_end_oid was stamped. The phase sheet's guidance (flip in_progress, then verify-vt) is wrong; a worker cannot get a VT verdict before the orchestrator commits and completes the phase."

