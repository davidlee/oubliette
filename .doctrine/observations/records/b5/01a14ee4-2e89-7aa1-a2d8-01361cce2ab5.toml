detail = "SL-006 run 1: PHASE-01's planner and worker final reports arrived at the seat, not orch-sl006-a; the worker said its hand-back failed with 'the agent that spawned you is no longer running' while the orchestrator was listed as running. The seat relayed by SendMessage. Later the seat's session restarted; the orchestrator (a teammate) did not survive it and its hand-back was lost, leaving PHASE-02 blocked on VH-1 unreported and PHASE-03 in_progress with an unverified uncommitted delta. Recovery was by reading phase tomls, git log and git status."

