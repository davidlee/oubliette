summary = "A suite case that reads a feature before it exists aborts the whole eval, so red-first needs guards"
detail = "SL-009 PHASE-02/03: cases reading slotRefusal, services.postgresql.package, listen_addresses or an unrendered fileSystems entry produced an eval abort, not a FAIL line, stopping every case. Workers added guards (optionalString, or, no-op extensions) to make reds attributable. A suite helper for 'read or report absent' would make this the default."

