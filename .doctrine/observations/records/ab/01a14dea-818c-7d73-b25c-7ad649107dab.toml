summary = "verify-vt attributes a VT only after phase completion binds its commit"
detail = "SL-005 PHASE-01: after committing, verify-vt still said UNATTRIBUTABLE until the phase flipped to completed (solo phase-binding). Workers read UNATTRIBUTABLE on their uncommitted delta and could not see PASS. Conversely PHASE-04 VT-1 already PASSes before PHASE-04 starts, because mkfleet.nix was modified by earlier phases and the keyword exists: attribution is per-slice, not per-phase."

